<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escola360 - Frontend (single-file)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind theme extension for school palette
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              schoolBlue: {
                50: '#f3f8fb',
                100: '#e6f1f8',
                500: '#0f6aa8',
                700: '#0b4f7a'
              },
              schoolGreen: {
                50: '#f3fbf6',
                500: '#14a76c'
              },
              softPurple: '#8b6acb'
            }
          }
        }
      }

      function toast(msg, error=false){
        if(!document.body){ return setTimeout(()=> toast(msg,error), 100) }
        console.log(msg)
        const el = document.createElement('div')
        el.className = 'fixed bottom-4 right-4 bg-white border p-3 rounded shadow'
        if(error) el.classList.add('text-red-600')
        el.textContent = msg
        document.body.appendChild(el)
        setTimeout(()=> el.remove(), 4000)
      }

      async function safeLoadAndRender(entity, filters={}){
        try{ if(typeof loadAndRender === 'function') return await loadAndRender(entity, filters) }catch(e){}
      }

      async function showUnifiedForm(opts={}){
        // remove existing form
        const existing = document.getElementById('form-area'); if(existing) existing.remove()
        const area = document.createElement('div'); area.id='form-area'; area.className='mt-6 bg-white p-4 rounded shadow'
        const title = document.createElement('h3'); title.className='font-semibold'; title.textContent = 'DADOS PESSOAIS E ENDEREÇO'
        area.appendChild(title)

        const grid = document.createElement('div'); grid.className='grid grid-cols-2 gap-3 mt-3'

        // Tipo: aluno ou professor (quando aplicável)
        const tipoWrap = document.createElement('div'); tipoWrap.className='flex flex-col'
        const tipoLabel = document.createElement('label'); tipoLabel.className='text-xs text-slate-600 mb-1'; tipoLabel.textContent='Tipo'
        const tipoSel = document.createElement('select'); tipoSel.className='border rounded px-2 py-1'; tipoSel.id='un_tipo'
        tipoSel.appendChild(new Option('Aluno','aluno'))
        tipoSel.appendChild(new Option('Professor','professor'))
        // if opts.tipo is provided and is one of the selectable values, pre-select it
        if(opts && (opts.tipo === 'aluno' || opts.tipo === 'professor')){ try{ tipoSel.value = opts.tipo }catch(e){} }
        // hide tipo selector when opening specifically for 'usuario' or 'professor'
        if(opts && (opts.tipo === 'usuario' || opts.tipo === 'professor')) tipoWrap.style.display = 'none'
        tipoWrap.appendChild(tipoLabel); tipoWrap.appendChild(tipoSel); grid.appendChild(tipoWrap)

        // Usuario fields
        const nomeWrap = document.createElement('div'); nomeWrap.className='flex flex-col'
        const nomeLabel = document.createElement('label'); nomeLabel.className='text-xs text-slate-600 mb-1'; nomeLabel.textContent='Nome'
        const nomeInp = document.createElement('input'); nomeInp.className='border rounded px-2 py-1'; nomeInp.id='un_nome'
        nomeWrap.appendChild(nomeLabel); nomeWrap.appendChild(nomeInp); grid.appendChild(nomeWrap)

        const emailWrap = document.createElement('div'); emailWrap.className='flex flex-col'
        const emailLabel = document.createElement('label'); emailLabel.className='text-xs text-slate-600 mb-1'; emailLabel.textContent='Email'
        const emailInp = document.createElement('input'); emailInp.type='email'; emailInp.className='border rounded px-2 py-1'; emailInp.id='un_email'
        emailWrap.appendChild(emailLabel); emailWrap.appendChild(emailInp); grid.appendChild(emailWrap)

        const senhaWrap = document.createElement('div'); senhaWrap.className='flex flex-col'
        const senhaLabel = document.createElement('label'); senhaLabel.className='text-xs text-slate-600 mb-1'; senhaLabel.textContent='Senha'
        const senhaInp = document.createElement('input'); senhaInp.type='password'; senhaInp.className='border rounded px-2 py-1'; senhaInp.id='un_senha'
        senhaWrap.appendChild(senhaLabel); senhaWrap.appendChild(senhaInp); grid.appendChild(senhaWrap)

        const ativoWrap = document.createElement('div'); ativoWrap.className='flex items-center gap-2'
        const ativoInp = document.createElement('input'); ativoInp.type='checkbox'; ativoInp.id='un_ativo'; ativoInp.className='h-4 w-4'
        const ativoLabel = document.createElement('label'); ativoLabel.className='text-xs text-slate-600'; ativoLabel.textContent='Ativo'
        ativoWrap.appendChild(ativoInp); ativoWrap.appendChild(ativoLabel); grid.appendChild(ativoWrap)

        // Perfis (somente para usuarios do sistema) - será populado abaixo quando necessario
        const perfisWrap = document.createElement('div'); perfisWrap.className='flex flex-col'
        const perfisLabel = document.createElement('label'); perfisLabel.className='text-xs text-slate-600 mb-1'; perfisLabel.textContent='Perfis'
        const perfisSelect = document.createElement('select'); perfisSelect.id = 'un_perfis'; perfisSelect.className = 'border rounded px-2 py-1'; perfisSelect.size = 1
        const perfisDisabled = document.createElement('input'); perfisDisabled.type = 'text'; perfisDisabled.className = 'border rounded px-2 py-1 bg-slate-100'; perfisDisabled.disabled = true; perfisDisabled.id = 'un_perfil_disabled'; perfisDisabled.style.display = 'none'
        // id for preset perfil when using Cadastro de Responsáveis
        let presetPerfilId = null
        perfisWrap.appendChild(perfisLabel); perfisWrap.appendChild(perfisSelect); perfisWrap.appendChild(perfisDisabled); grid.appendChild(perfisWrap)

        // Common document fields
        const cpfWrap = document.createElement('div'); cpfWrap.className='flex flex-col'
        const cpfLabel = document.createElement('label'); cpfLabel.className='text-xs text-slate-600 mb-1'; cpfLabel.textContent='CPF'
        const cpfInp = document.createElement('input'); cpfInp.className='border rounded px-2 py-1'; cpfInp.id='un_cpf'
        cpfWrap.appendChild(cpfLabel); cpfWrap.appendChild(cpfInp); grid.appendChild(cpfWrap)

        const dataNascWrap = document.createElement('div'); dataNascWrap.className='flex flex-col'
        const dataNascLabel = document.createElement('label'); dataNascLabel.className='text-xs text-slate-600 mb-1'; dataNascLabel.textContent='Data Nascimento'
        const dataNascInp = document.createElement('input'); dataNascInp.type='date'; dataNascInp.className='border rounded px-2 py-1'; dataNascInp.id='un_data_nascimento'
        dataNascWrap.appendChild(dataNascLabel); dataNascWrap.appendChild(dataNascInp); grid.appendChild(dataNascWrap)

        const dataAdmWrap = document.createElement('div'); dataAdmWrap.className='flex flex-col'
        const dataAdmLabel = document.createElement('label'); dataAdmLabel.className='text-xs text-slate-600 mb-1'; dataAdmLabel.textContent='Data Admissão (professor)'
        const dataAdmInp = document.createElement('input'); dataAdmInp.type='date'; dataAdmInp.className='border rounded px-2 py-1'; dataAdmInp.id='un_data_admissao'
        dataAdmWrap.appendChild(dataAdmLabel); dataAdmWrap.appendChild(dataAdmInp); grid.appendChild(dataAdmWrap)

        // Address fields
        const cepWrap = document.createElement('div'); cepWrap.className='flex flex-col'
        const cepLabel = document.createElement('label'); cepLabel.className='text-xs text-slate-600 mb-1'; cepLabel.textContent='CEP'
        const cepInp = document.createElement('input'); cepInp.className='border rounded px-2 py-1'; cepInp.id='un_cep'
        cepWrap.appendChild(cepLabel); cepWrap.appendChild(cepInp)
        const cepStatus = document.createElement('div'); cepStatus.className = 'text-xs text-slate-500 mt-1'; cepStatus.style.minHeight = '1rem'
        cepWrap.appendChild(cepStatus);
        grid.appendChild(cepWrap)
        // id of existing endereco when editing
        let existingEnderecoId = null

        const logWrap = document.createElement('div'); logWrap.className='flex flex-col'
        const logLabel = document.createElement('label'); logLabel.className='text-xs text-slate-600 mb-1'; logLabel.textContent='Logradouro'
        const logInp = document.createElement('input'); logInp.className='border rounded px-2 py-1'; logInp.id='un_logradouro'
        logWrap.appendChild(logLabel); logWrap.appendChild(logInp); grid.appendChild(logWrap)

        const compWrap = document.createElement('div'); compWrap.className='flex flex-col'
        const compLabel = document.createElement('label'); compLabel.className='text-xs text-slate-600 mb-1'; compLabel.textContent='Complemento'
        const compInp = document.createElement('input'); compInp.className='border rounded px-2 py-1'; compInp.id='un_complemento'
        compWrap.appendChild(compLabel); compWrap.appendChild(compInp); grid.appendChild(compWrap)

        const numeroWrap = document.createElement('div'); numeroWrap.className='flex flex-col'
        const numeroLabel = document.createElement('label'); numeroLabel.className='text-xs text-slate-600 mb-1'; numeroLabel.textContent='Número'
        const numeroInp = document.createElement('input'); numeroInp.className='border rounded px-2 py-1'; numeroInp.id='un_numero'
        numeroWrap.appendChild(numeroLabel); numeroWrap.appendChild(numeroInp); grid.appendChild(numeroWrap)

        const bairroWrap = document.createElement('div'); bairroWrap.className='flex flex-col'
        const bairroLabel = document.createElement('label'); bairroLabel.className='text-xs text-slate-600 mb-1'; bairroLabel.textContent='Bairro'
        const bairroInp = document.createElement('input'); bairroInp.className='border rounded px-2 py-1'; bairroInp.id='un_bairro'
        bairroWrap.appendChild(bairroLabel); bairroWrap.appendChild(bairroInp); grid.appendChild(bairroWrap)

        const ufWrap = document.createElement('div'); ufWrap.className='flex flex-col'
        const ufLabel = document.createElement('label'); ufLabel.className='text-xs text-slate-600 mb-1'; ufLabel.textContent='UF'
        const ufInp = document.createElement('input'); ufInp.className='border rounded px-2 py-1'; ufInp.id='un_uf'
        ufWrap.appendChild(ufLabel); ufWrap.appendChild(ufInp); grid.appendChild(ufWrap)

        const cidadeWrap = document.createElement('div'); cidadeWrap.className='flex flex-col'
        const cidadeLabel = document.createElement('label'); cidadeLabel.className='text-xs text-slate-600 mb-1'; cidadeLabel.textContent='Cidade'
        const cidadeInp = document.createElement('input'); cidadeInp.className='border rounded px-2 py-1'; cidadeInp.id='un_cidade'
        cidadeWrap.appendChild(cidadeLabel); cidadeWrap.appendChild(cidadeInp); grid.appendChild(cidadeWrap)

        area.appendChild(grid)

        // show/hide fields depending on tipo (respect opts.tipo when provided)
        function refreshTipo(){
          const tipo = (opts && opts.tipo) ? opts.tipo : tipoSel.value
          dataNascWrap.style.display = tipo === 'aluno' ? '' : 'none'
          cpfWrap.style.display = (tipo === 'aluno' || tipo === 'professor') ? '' : 'none'
          dataAdmWrap.style.display = tipo === 'professor' ? '' : 'none'
          // show responsáveis only for alunos
          try{ responsaveisSection.style.display = tipo === 'aluno' ? '' : 'none' }catch(e){}
        }
        tipoSel.addEventListener('change', refreshTipo)
        refreshTipo()

        // ViaCEP lookup: fill address fields when CEP is entered
        let cepTimer
        cepInp.addEventListener('input', ()=>{ cepStatus.textContent=''; clearTimeout(cepTimer); cepTimer = setTimeout(runCepLookup, 600) })
        cepInp.addEventListener('blur', runCepLookup)
        async function runCepLookup(){
          const raw = (cepInp.value || '').replace(/\D/g,'')
          if(!raw || raw.length !== 8) return
          cepStatus.textContent = 'Consultando CEP...'
          try{
            const res = await axios.get('https://viacep.com.br/ws/' + raw + '/json/')
            const data = res.data
            if(!data || data.erro){ cepStatus.textContent = 'CEP não encontrado'; cepStatus.className = 'text-xs text-red-600 mt-1'; return }
            logInp.value = data.logradouro || ''
            compInp.value = data.complemento || ''
            bairroInp.value = data.bairro || ''
            ufInp.value = data.uf || ''
            cidadeInp.value = data.localidade || ''
            cepStatus.textContent = ''
            cepStatus.className = 'text-xs text-slate-500 mt-1'
          }catch(e){ console.error('viacep', e); cepStatus.textContent = 'Erro ao consultar CEP'; cepStatus.className = 'text-xs text-red-600 mt-1' }
        }

        // Responsáveis (apenas para tipo aluno) — simplified: CPF lookup + nome preenchido
        const responsaveisSection = document.createElement('div'); responsaveisSection.className = 'mt-4 col-span-2'
        const respTitle = document.createElement('h4'); respTitle.className = 'font-semibold text-sm mb-2'; respTitle.textContent = 'Responsáveis (opcional)'
        responsaveisSection.appendChild(respTitle)

        // list of pending responsaveis
        const respList = document.createElement('ul'); respList.className = 'mb-2 list-disc pl-5 text-sm text-slate-700'
        responsaveisSection.appendChild(respList)

        // input: CPF to lookup existing user and Name display (auto-filled)
        const lookupWrap = document.createElement('div'); lookupWrap.className = 'flex gap-2 items-end mb-2'
        const cpfResp = document.createElement('input'); cpfResp.placeholder = 'CPF do responsável'; cpfResp.className='border rounded px-2 py-1'; cpfResp.style.minWidth='200px'
        const nomeResp = document.createElement('input'); nomeResp.placeholder = 'Nome (preenchido)'; nomeResp.className='border rounded px-2 py-1 flex-1'; nomeResp.readOnly = true
        const addRespBtn = document.createElement('button'); addRespBtn.className='px-2 py-1 bg-slate-100 rounded text-sm'; addRespBtn.textContent='Adicionar'
        lookupWrap.appendChild(cpfResp); lookupWrap.appendChild(nomeResp); lookupWrap.appendChild(addRespBtn)
        responsaveisSection.appendChild(lookupWrap)

        const pendingResponsaveis = []
        function refreshRespList(){
          respList.innerHTML = ''
          pendingResponsaveis.forEach((r, idx)=>{
            const li = document.createElement('li'); li.textContent = (r.nome || ('#' + r.id_usuario))
            const rem = document.createElement('button'); rem.className='ml-2 text-red-600 text-xs'; rem.textContent='Remover'; rem.addEventListener('click', ()=>{ pendingResponsaveis.splice(idx,1); refreshRespList() })
            li.appendChild(rem); respList.appendChild(li)
          })
        }

        // lookup by CPF: search in alunos and professores to map to a usuario
        async function lookupResponsavelByCpf(){
          const raw = (cpfResp.value || '').replace(/\D/g,'')
          nomeResp.value = ''
          if(!raw || raw.length !== 11) return
          try{
            const [aRes, pRes, uRes] = await Promise.all([axios.get('/alunos'), axios.get('/professores'), axios.get('/usuarios')])
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const profs = Array.isArray(pRes.data)? pRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const foundA = alunos.find(a=> (a.cpf||'') === raw)
            const foundP = profs.find(p=> (p.cpf||'') === raw)
            let userId = null
            if(foundA) userId = foundA.id_usuario
            else if(foundP) userId = foundP.id_usuario
            if(userId){ const u = users.find(x=> String(x.id_usuario) === String(userId)); if(u) nomeResp.value = u.nome }
          }catch(e){ console.error('lookupResponsavelByCpf', e) }
        }

        // If this form is for 'usuario', load perfis and build radio buttons (single selection)
        if(opts && (opts.tipo === 'usuario' || opts.tipo === 'professor' || opts.cadastroResponsaveis)){
          try{
            const pRes = await axios.get('/perfis')
            const perfis = Array.isArray(pRes.data)? pRes.data : []
            perfisSelect.innerHTML = ''
            // when cadastroResponsaveis, preset to RESPONSAVEL and show disabled input
            if(opts.cadastroResponsaveis){
              const found = perfis.find(pp=> String((pp.nome||'').toUpperCase()) === 'RESPONSAVEL' || String((pp.nome||'').toUpperCase()) === 'RESPONSÁVEL')
              if(found){
                presetPerfilId = found.id_perfil || found.id
                try{ perfisDisabled.value = found.nome }catch(e){}
                perfisDisabled.style.display = ''
                perfisSelect.style.display = 'none'
              } else {
                perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) })
              }
            } else if(opts.tipo === 'professor'){
              // preset to PROFESSOR for professor forms
              const found = perfis.find(pp=> String((pp.nome||'').toUpperCase()) === 'PROFESSOR')
              if(found){ presetPerfilId = found.id_perfil || found.id; try{ perfisDisabled.value = found.nome }catch(e){}; perfisDisabled.style.display = ''; perfisSelect.style.display = 'none' }
              else { perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) }) }
            } else {
              perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) })
            }
          }catch(e){ console.error('load perfis', e) }
        } else {
          // hide perfis control for non-usuarios and non-professores
          perfisWrap.style.display = 'none'
        }

        cpfResp.addEventListener('blur', lookupResponsavelByCpf)
        cpfResp.addEventListener('input', ()=>{ nomeResp.value = '' })

        addRespBtn.addEventListener('click', async ()=>{
          const raw = (cpfResp.value || '').replace(/\D/g,'')
          if(!raw || raw.length !== 11){ toast('CPF inválido', true); return }
          // attempt lookup; if not found, warn
          await lookupResponsavelByCpf()
          if(!nomeResp.value){ toast('Usuário com esse CPF não encontrado', true); return }
          // find usuario id
          try{
            const uRes = await axios.get('/usuarios')
            const users = Array.isArray(uRes.data)? uRes.data : []
            // find matching usuario by name (best-effort) via alunos/professores mapping
            const [aRes, pRes] = await Promise.all([axios.get('/alunos'), axios.get('/professores')])
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const profs = Array.isArray(pRes.data)? pRes.data : []
            const foundA = alunos.find(a=> (a.cpf||'') === raw)
            const foundP = profs.find(p=> (p.cpf||'') === raw)
            let userId = foundA ? foundA.id_usuario : (foundP ? foundP.id_usuario : null)
            if(!userId){ toast('Usuário não encontrado para vincular', true); return }
            if(pendingResponsaveis.some(p=> String(p.id_usuario) === String(userId))){ toast('Responsável já adicionado', true); return }
            const userObj = users.find(u=> String(u.id_usuario) === String(userId))
            pendingResponsaveis.push({ id_usuario: userId, nome: (userObj? userObj.nome : nomeResp.value) })
            refreshRespList()
            cpfResp.value=''; nomeResp.value=''
          }catch(e){ console.error('add responsavel', e); toast('Erro ao adicionar responsável', true) }
        })

        // attach responsaveis section (it will be hidden for professor via refreshTipo)
        area.appendChild(responsaveisSection)

        // If editing, prefill fields (usuario, aluno/professor specific, endereco, responsaveis)
        if(opts && opts.editing){
          (async ()=>{
            const ed = opts.editing || {}
            try{
              // populate usuario fields from id_usuario if available
                  if(ed.id_usuario){
                    try{
                      const uRes = await axios.get('/usuarios')
                      const users = Array.isArray(uRes.data)? uRes.data : []
                      const u = users.find(x=> String(x.id_usuario) === String(ed.id_usuario))
                      if(u){ nomeInp.value = u.nome || ''; emailInp.value = u.email || ''; ativoInp.checked = Boolean(u.ativo)
                        // preselect perfis if present (radio inputs)
                        try{
                          const selected = u._perfis || (ed._perfis || [])
                          const selIds = Array.isArray(selected) ? selected.map(x=> Number(x.id_perfil || x || x.id || x)) : []
                          if(selIds.length){
                            const target = String(selIds[0])
                            try{ perfisSelect.value = target }catch(e){}
                          }
                        }catch(e){}
                      }
                    }catch(e){}
                  } else if(ed.nome){ nomeInp.value = ed.nome }

              if(ed.cpf) cpfInp.value = ed.cpf
              if(ed.data_nascimento) dataNascInp.value = ed.data_nascimento
              if(ed.data_admissao) dataAdmInp.value = ed.data_admissao

              // endereco: find first endereco for this usuario
              if(ed.id_usuario){
                try{
                  const eRes = await axios.get('/enderecos')
                  const ends = Array.isArray(eRes.data)? eRes.data : []
                  const my = ends.find(x=> String(x.tb_usuarios_id_usuario) === String(ed.id_usuario))
                  if(my){ existingEnderecoId = my.id_endereco || my.id || my.id_endereco || null; cepInp.value = my.cep || ''; logInp.value = my.logradouro || ''; compInp.value = my.complemento || ''; numeroInp.value = my.numero || ''; bairroInp.value = my.bairro || ''; ufInp.value = my.uf || ''; cidadeInp.value = my.cidade || '' }
                }catch(e){}
              }

              // responsaveis: if editing an aluno, load existing links
              if(ed.id_aluno){
                try{
                  const rRes = await axios.get('/responsaveis', { params: { alunoId: ed.id_aluno } })
                  const links = Array.isArray(rRes.data)? rRes.data : []
                  if(links.length){
                    try{
                      const uRes = await axios.get('/usuarios')
                      const users = Array.isArray(uRes.data)? uRes.data : []
                      links.forEach(l=>{
                        const u = users.find(x=> String(x.id_usuario) === String(l.tb_usuarios_id_usuario))
                        pendingResponsaveis.push({ id_usuario: l.tb_usuarios_id_usuario, nome: u? u.nome : String(l.tb_usuarios_id_usuario) })
                      })
                      refreshRespList()
                    }catch(e){}
                  }
                }catch(e){}
              }
            }catch(e){ console.error('prefill unified form', e) }
          })()
        }

        const btnSave = document.createElement('button'); btnSave.className='px-3 py-1 bg-schoolBlue-500 text-white rounded mr-2'; btnSave.textContent='Salvar'
        const statusDiv = document.createElement('div'); statusDiv.className = 'mt-3 text-sm'
        btnSave.addEventListener('click', async ()=>{
          const tipo = (opts && opts.tipo) ? opts.tipo : tipoSel.value
          const usuarioPayload = { nome: nomeInp.value, email: emailInp.value }
          if(senhaInp.value) usuarioPayload.senha = senhaInp.value
          usuarioPayload.ativo = ativoInp.checked
          // include perfis when visible
          try{
            if(perfisWrap.style.display !== 'none'){
              if((opts && opts.cadastroResponsaveis && presetPerfilId) || (opts && opts.tipo === 'professor' && presetPerfilId)){
                usuarioPayload.perfis = [ Number(presetPerfilId) ]
              } else {
                const v = perfisSelect.value
                if(v) usuarioPayload.perfis = [ Number(v) ]
              }
            }
          }catch(e){}
          // disable while saving
          btnSave.disabled = true; btnSave.textContent = 'Salvando...'; statusDiv.textContent = ''
          try{
            // create or update usuario
            const isEditing = opts && opts.editing
            let uRes
            if(isEditing){
              const userId = opts.editing.id_usuario || opts.editing.id
              uRes = await axios.put('/usuarios/' + userId, usuarioPayload)
            } else {
              uRes = await axios.post('/usuarios', usuarioPayload)
            }
            const user = uRes.data || {}
            const id_usuario = user.id_usuario || user.id || user.id_usuario
            if(!id_usuario) throw new Error('Usuário criado sem id_usuario')

            // create or update aluno/professor when applicable
            let createdAlunoId = null
            if(tipo === 'aluno'){
              const alunoPayload = { id_usuario: id_usuario, cpf: (cpfInp.value||'').replace(/\D/g,''), data_nascimento: dataNascInp.value || null }
              if(opts && opts.editing && (opts.editing.id_aluno || opts.editing.id)){
                const aid = opts.editing.id_aluno || opts.editing.id
                try{ await axios.put('/alunos/' + aid, alunoPayload) }catch(e){ console.error('update aluno', e) }
                createdAlunoId = aid
              } else {
                const aRes = await axios.post('/alunos', alunoPayload)
                const aData = aRes.data || {}
                createdAlunoId = aData.id_aluno || aData.id || aData.id_aluno
              }
            } else if(tipo === 'professor'){
              const profPayload = { id_usuario: id_usuario, cpf: (cpfInp.value||'').replace(/\D/g,''), data_admissao: dataAdmInp.value || null }
              if(opts && opts.editing && (opts.editing.id_professor || opts.editing.id)){
                const pid = opts.editing.id_professor || opts.editing.id
                try{ await axios.put('/professores/' + pid, profPayload) }catch(e){ console.error('update professor', e) }
              } else {
                try{ await axios.post('/professores', profPayload) }catch(e){}
              }
            } else {
              // tipo === 'usuario' -> do not create aluno/professor
            }

            // create endereco (optional fields allowed)
            const enderecoPayload = {
              tb_usuarios_id_usuario: id_usuario,
              cep: cepInp.value || null,
              logradouro: logInp.value || null,
              complemento: compInp.value || null,
              numero: numeroInp.value || null,
              bairro: bairroInp.value || null,
              uf: ufInp.value || null,
              cidade: cidadeInp.value || null
            }
            // create or update endereco
            try{
              if(isEditing && existingEnderecoId){
                await axios.put('/enderecos/' + existingEnderecoId, enderecoPayload)
              } else {
                await axios.post('/enderecos', enderecoPayload)
              }
            }catch(e){ console.error('save endereco', e) }

            // if there are pending responsaveis and we created an aluno, link them
            if(tipo === 'aluno' && createdAlunoId){
              for(const r of (pendingResponsaveis || [])){
                try{ await axios.post('/responsaveis', { tb_alunos_id_aluno: createdAlunoId, tb_usuarios_id_usuario: r.id_usuario }) }catch(e){ console.error('link responsavel', e) }
              }
            }

            // success
            statusDiv.className = 'mt-3 text-sm text-green-600'
            statusDiv.textContent = 'Cadastro de responsáveis realizado com sucesso.'
            toast('Cadastro de responsáveis realizado com sucesso')
            // refresh users and relevant lists (use safe wrapper)
            await safeLoadAndRender('usuarios')
            await safeLoadAndRender('alunos')
            await safeLoadAndRender('professores')
            // remove form after short delay so user sees success
            setTimeout(()=> area.remove(), 1200)
          }catch(err){
            console.error('cadastro-responsaveis', err)
            const msg = err && err.response && (err.response.data && (err.response.data.error || err.response.data.message)) ? (err.response.data.error || err.response.data.message) : (err.message || 'Erro no cadastro')
            statusDiv.className = 'mt-3 text-sm text-red-600'
            statusDiv.textContent = 'Erro: ' + msg
            toast('Erro no cadastro: ' + msg, true)
          }finally{
            btnSave.disabled = false; btnSave.textContent = 'Salvar'
          }
        })
        const btnCancel = document.createElement('button'); btnCancel.className='px-3 py-1 bg-slate-100 rounded'; btnCancel.textContent='Cancelar'; btnCancel.addEventListener('click', ()=> area.remove())
        const actions = document.createElement('div'); actions.className='mt-3'; actions.appendChild(btnSave); actions.appendChild(btnCancel)
        area.appendChild(actions)
        area.appendChild(statusDiv)
        content.appendChild(area)
      }
    </script>

      async function fetchOptions(source, valueKey='id', labelKey){
        if(!source) return []
        if(OPTIONS_CACHE[source]) return OPTIONS_CACHE[source]
        try{
          const res = await axios.get(source)
          const items = Array.isArray(res.data)? res.data : []

          // helpers to bulk-fetch related entities
          const fetchAll = async (path)=>{
            try{ const r = await axios.get(path); return Array.isArray(r.data)? r.data : [] }catch(e){ return [] }
          }

          let opts = []
          // special cases to build friendly labels without changing the API
          if(source === '/alunos'){
            const users = await fetchAll('/usuarios')
            const uMap = {};
            users.forEach(u=> uMap[u.id_usuario] = u.nome)
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_aluno
              const label = uMap[it.id_usuario] || it.cpf || String(val)
              return { value: val, label }
            })
          } else if(source === '/professores'){
            const users = await fetchAll('/usuarios')
            const uMap = {};
            users.forEach(u=> uMap[u.id_usuario] = u.nome)
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_professor
              const label = uMap[it.id_usuario] || it.cpf || String(val)
              return { value: val, label }
            })
          } else if(source === '/turma-disciplinas'){
            const turmas = await fetchAll('/turmas')
            const disciplinas = await fetchAll('/disciplinas')
            const tMap = {}
            turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}
            disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_turma_disciplina
              const turmaNome = tMap[it.id_turma]
              const discNome = dMap[it.id_disciplina]
              const label = (turmaNome && discNome) ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || String(val))
              return { value: val, label }
            })
          } else if(source === '/matriculas'){
            const alunos = await fetchAll('/alunos')
            const users = await fetchAll('/usuarios')
            const aMap = {}
            alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}
            users.forEach(u=> uMap[u.id_usuario] = u.nome)
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_matricula
              const aluno = aMap[it.id_aluno]
              const label = aluno ? (uMap[aluno.id_usuario] || aluno.cpf) : String(val)
              return { value: val, label }
            })
          } else {
            // default behavior
            opts = items.map(it => {
              const val = it[valueKey] ?? it.id ?? Object.values(it)[0]
              let label = ''
              if(labelKey && it[labelKey]) label = String(it[labelKey])
              else {
                const common = ['nome','descricao','email','cpf']
                const found = common.find(k=> it[k])
                label = found ? String(it[found]) : String(val)
              }
              return { value: val, label }
            })
          }

          OPTIONS_CACHE[source] = opts
          return opts
        }catch(e){ console.error('fetchOptions', source, e); return [] }
      }

      async function loadAndRender(entity, filters={}){
        const wrap = document.getElementById('list-wrap')
        if(!wrap) return
        wrap.innerHTML = 'Carregando...'
        try{
          const res = await axios.get('/' + entity, { params: filters })
          let items = Array.isArray(res.data) ? res.data : []
          // client-side enrichment and filtering for notas
          if(entity === 'notas'){
            const [mRes, aRes, uRes, avRes] = await Promise.all([axios.get('/matriculas'), axios.get('/alunos'), axios.get('/usuarios'), axios.get('/avaliacoes')])
            const matriculas = Array.isArray(mRes.data)? mRes.data : []
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const avals = Array.isArray(avRes.data)? avRes.data : []
            const mMap = {}; matriculas.forEach(m=> mMap[m.id_matricula] = m)
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)
            const avMap = {}; avals.forEach(av=> avMap[av.id_avaliacao] = av.descricao)
            items = items.map(it => {
              const mat = mMap[it.id_matricula]
              const aluno = mat? aMap[mat.id_aluno] : null
              const nome = aluno? (uMap[aluno.id_usuario] || aluno.cpf) : ''
              return Object.assign({}, it, { _aluno_nome: nome, _avaliacao_desc: avMap[it.id_avaliacao] || it.id_avaliacao })
            })
            if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._aluno_nome||'').toLowerCase().includes(q)) }
          }
            // client-side enrichment for alunos: resolve usuario name into _nome
            if(entity === 'alunos'){
              try{
                const uRes = await axios.get('/usuarios')
                const users = Array.isArray(uRes.data)? uRes.data : []
                const uMap = {}
                users.forEach(u=> uMap[u.id_usuario] = u.nome)
                items = items.map(it=> Object.assign({}, it, { _nome: uMap[it.id_usuario] || '' }))
                if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._nome||'').toLowerCase().includes(q)) }
              }catch(e){ console.error('alunos enrichment', e) }
            }
            // client-side filtering for usuarios (by nome)
            if(entity === 'usuarios'){
              if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i.nome||'').toLowerCase().includes(q)) }
            }
          // client-side enrichment for matriculas: resolve aluno name and turma name
          if(entity === 'matriculas'){
            const [aRes, uRes, tRes] = await Promise.all([axios.get('/alunos'), axios.get('/usuarios'), axios.get('/turmas')])
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            items = items.map(it => {
              const aluno = aMap[it.id_aluno]
              const nome = aluno? (uMap[aluno.id_usuario] || aluno.cpf) : ''
              const turmaNome = tMap[it.id_turma] || ''
              return Object.assign({}, it, { _aluno_nome: nome, _turma_nome: turmaNome })
            })
            if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._aluno_nome||'').toLowerCase().includes(q)) }

          // client-side enrichment and filtering for turma-disciplinas

            const profs = Array.isArray(pRes.data)? pRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)

            const users = Array.isArray(uRes.data)? uRes.data : []

            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const disciplinas = Array.isArray(dRes.data)? dRes.data : []

            const tds = Array.isArray(tdRes.data)? tdRes.data : []

            const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)
            const tdMap = {}; tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            items = items.map(it => {

              const td = tdMap[it.id_turma_disciplina]

      function buildField(meta, value){
        const wrapper = document.createElement('div'); wrapper.className='flex flex-col'
        // hidden fields should not show label
        if(meta.type === 'hidden'){
          const input = document.createElement('input'); input.type = 'hidden'; input.value = value || ''
          wrapper.style.display = 'none'
          wrapper.appendChild(input)
          return { wrapper, input }
        }
        const label = document.createElement('label'); label.className='text-xs text-slate-600 mb-1'; label.textContent = meta.label
        let input
        if(meta.type === 'select'){
          input = document.createElement('select'); input.className='border rounded px-2 py-1'
          if(meta.options && meta.options.length){
            meta.options.forEach(o=>{ const opt = document.createElement('option'); opt.value=o; opt.textContent=o; input.appendChild(opt) })
            input.value = value || meta.options[0]
          }
        }else if(meta.type === 'checkbox'){
          input = document.createElement('input'); input.type='checkbox'; input.className='h-4 w-4'
          if(value===true || value===1 || value==='1' || value==='true') input.checked = true
        }else{
          input = document.createElement('input'); input.type = meta.type || 'text'; input.className='border rounded px-2 py-1'
          if(meta.step) input.step = meta.step
          input.value = value || ''
        }
        wrapper.appendChild(label); wrapper.appendChild(input)
        return { wrapper, input }
      }

      async function showForm(entity, editing){
        // remove existing form
        const existing = document.getElementById('form-area'); if(existing) existing.remove()
        const meta = ENTITIES[entity]
        const area = document.createElement('div'); area.id='form-area'; area.className='mt-6 bg-white p-4 rounded shadow'
        const title = document.createElement('h3'); title.className='font-semibold'; title.textContent = (editing? 'Editar ' : 'Criar ') + meta.label
        area.appendChild(title)
        const grid = document.createElement('div'); grid.className='grid grid-cols-2 gap-3 mt-3'
        const inputs = {}
        // build fields (handle async option sources)
        for(const f of meta.fields){
          const { wrapper, input } = buildField(f, '')
          inputs[f.name] = input
          grid.appendChild(wrapper)
        }
        area.appendChild(grid)

        // special UX for `alunos`: show a disabled display input for usuário name
        if(entity === 'alunos'){
          const cpfNode = inputs['cpf']
          const hiddenNode = inputs['id_usuario']
          // lookup function: fetch lists and match cpf client-side (sets id_usuario)
          const lookupByCpf = async (cpf)=>{
            const norm = (cpf||'').replace(/\D/g,'')
            // if no cpf normalized, do not modify current select value — just clear any pending lookup
            if(!norm){ delete hiddenNode.dataset.pending; return }
            try{
              const [alRes, profRes] = await Promise.all([axios.get('/alunos'), axios.get('/professores')])
              const alunos = Array.isArray(alRes.data)? alRes.data : []
              const profs = Array.isArray(profRes.data)? profRes.data : []
              const foundA = alunos.find(a=> (a.cpf||'') === norm)
              if(foundA){
                hiddenNode.dataset.pending = String(foundA.id_usuario || '')
                // do not assign hiddenNode.value now — wait until select options exist
                return
              }
              const foundP = profs.find(p=> (p.cpf||'') === norm)
              if(foundP){
                hiddenNode.dataset.pending = String(foundP.id_usuario || '')
                return
              }
              // no match: remove pending but keep current selection unchanged
              delete hiddenNode.dataset.pending
            }catch(e){ console.error('lookupByCpf', e); delete hiddenNode.dataset.pending }
          }

          if(cpfNode){ cpfNode.addEventListener('blur', ()=> lookupByCpf(cpfNode.value || '')) }
          // when editing, pre-fill id_usuario from editing values
          if(editing){
            if(editing.id_usuario){
              hiddenNode.value = editing.id_usuario
            } else if(editing.cpf) {
              await lookupByCpf(editing.cpf)
            }
          }
        }

        // populate selects that have source and set editing values
        for(const f of meta.fields){
          if(f.type === 'select' && f.source){
            const opts = await fetchOptions(f.source, f.valueKey || f.name, f.labelKey)
            const sel = inputs[f.name]
            sel.innerHTML = ''
            opts.forEach(o=> sel.appendChild(new Option(o.label, o.value)))
            if(sel.dataset.pending){ sel.value = sel.dataset.pending; delete sel.dataset.pending }
            else if(editing && editing[f.name] !== undefined) sel.value = editing[f.name]
          } else {
            if(editing && editing[f.name] !== undefined){
              const node = inputs[f.name]
              if(f.type === 'checkbox') node.checked = Boolean(editing[f.name])
              else node.value = editing[f.name]
            }
          }
        }

        // For alunos: if a pending id was set before options existed, ensure it survives later input changes
        if(entity === 'alunos'){
          const userSel = inputs['id_usuario']
          if(userSel){
            Object.keys(inputs).forEach(k=>{
              const node = inputs[k]
              if(node && typeof node.addEventListener === 'function'){
                node.addEventListener('change', ()=>{
                  if(userSel.dataset && userSel.dataset.pending && (userSel.value === '' || userSel.value === undefined)){
                    const pending = userSel.dataset.pending
                    const hasOption = Array.from(userSel.options || []).some(o=> String(o.value) === String(pending))
                    if(hasOption){
                      try{ userSel.value = pending }catch(e){}
                      delete userSel.dataset.pending
                    }
                  }
                })
              }
            })
          }
        }

        // dynamic behavior for frequencias form: when turma-disciplina changes, limit matricula options to that turma
        if(entity === 'frequencias'){
          try{
            const tdSel = inputs['id_turma_disciplina']
            const matSel = inputs['id_matricula']
            const [tdRes, mRes, aRes, uRes] = await Promise.all([axios.get('/turma-disciplinas'), axios.get('/matriculas'), axios.get('/alunos'), axios.get('/usuarios')])
            const tds = Array.isArray(tdRes.data)? tdRes.data : []
            const mats = Array.isArray(mRes.data)? mRes.data : []
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tdMap = {};
            tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)

            const rebuildMatOptions = (selectedTdId)=>{
              matSel.innerHTML = ''
              const filtered = selectedTdId ? mats.filter(m=> String(m.id_turma) === String(tdMap[selectedTdId].id_turma)) : mats
              filtered.forEach(m=>{
                const aluno = aMap[m.id_aluno]
                const label = aluno? (uMap[aluno.id_usuario] || aluno.cpf) : String(m.id_matricula)
                matSel.appendChild(new Option(label, m.id_matricula))
              })
            }

            // initial build (respect editing value)
            rebuildMatOptions(tdSel.value || undefined)
            if(editing && editing.id_matricula) matSel.value = editing.id_matricula

            tdSel.addEventListener('change', ()=> rebuildMatOptions(tdSel.value || undefined))
          }catch(e){ console.error('frequencias form dynamic', e) }
        }

        const btnSave = document.createElement('button'); btnSave.className='px-3 py-1 bg-schoolBlue-500 text-white rounded mr-2'; btnSave.textContent='Salvar'
        btnSave.addEventListener('click', async ()=>{
          const payload = {}
          meta.fields.forEach(f=>{
            const node = inputs[f.name]
            let val
            if(f.type === 'checkbox') val = Boolean(node.checked)
            else {
              val = node.value
              if((val === '' || val === undefined) && node && node.dataset && node.dataset.pending) val = node.dataset.pending
            }
            payload[f.name] = val
          })
          try{
            if(editing){
              // find id key
              const idKey = Object.keys(editing).find(k=>k.startsWith('id_')) || 'id'
              await axios.put('/' + entity + '/' + editing[idKey], payload)
              toast('Atualizado com sucesso')
            }else{
              await axios.post('/' + entity, payload)
              toast('Criado com sucesso')
            }
            // refresh list
            await loadAndRender(entity)
            // remove form
            area.remove()
          }catch(err){ console.error(err); toast('Erro ao salvar: ' + (err.response? err.response.status : err.message), true) }
        })
        const btnCancel = document.createElement('button'); btnCancel.className='px-3 py-1 bg-slate-100 rounded'; btnCancel.textContent='Cancelar'; btnCancel.addEventListener('click', ()=> area.remove())
        const actions = document.createElement('div'); actions.className='mt-3'; actions.appendChild(btnSave); actions.appendChild(btnCancel)
        area.appendChild(actions)
        content.appendChild(area)
      }

      async function removeItem(entity, item){
        if(!confirm('Remover?')) return
        const idKey = Object.keys(item).find(k=>k.startsWith('id_')) || 'id'
        try{
          await axios.delete('/' + entity + '/' + item[idKey])
          toast('Removido')
          await loadAndRender(entity)
        }catch(err){ console.error(err); toast('Erro ao remover', true) }
      }

      // init
      createMenu()
      // auto-open first
      openEntity(Object.keys(ENTITIES)[0])
    })()
    </script>
  </body>
</html>
