      function buildField(meta, value){
        const wrapper = document.createElement('div'); wrapper.className='flex flex-col'
        // hidden fields should not show label
        if(meta.type === 'hidden'){
          const input = document.createElement('input'); input.type = 'hidden'; input.value = value || ''
          wrapper.style.display = 'none'
          wrapper.appendChild(input)
          return { wrapper, input }
        }
        const label = document.createElement('label'); label.className='text-xs text-slate-600 mb-1'; label.textContent = meta.label
        let input
        if(meta.type === 'select'){
          input = document.createElement('select'); input.className='border rounded px-2 py-1'
          if(meta.options && meta.options.length){
            meta.options.forEach(o=>{ const opt = document.createElement('option'); opt.value=o; opt.textContent=o; input.appendChild(opt) })
            input.value = value || meta.options[0]
          }
        }else if(meta.type === 'checkbox'){
          input = document.createElement('input'); input.type='checkbox'; input.className='h-4 w-4'
          if(value===true || value===1 || value==='1' || value==='true') input.checked = true
        }else{
          input = document.createElement('input'); input.type = meta.type || 'text'; input.className='border rounded px-2 py-1'
          if(meta.step) input.step = meta.step
          input.value = value || ''
          // apply uppercase display and enforce uppercase on user input for text-like fields
          try{
            if(input.type !== 'password' && input.type !== 'date' && input.type !== 'number' && input.type !== 'checkbox' && input.type !== 'email'){
              input.style.textTransform = 'uppercase'
              input.addEventListener('input', ()=>{ input.value = input.value.toUpperCase() })
            }
          }catch(e){}
        }
        wrapper.appendChild(label); wrapper.appendChild(input)
        return { wrapper, input }
      }

      async function showForm(entity, editing){
        // remove existing form
        const existing = document.getElementById('form-area'); if(existing) existing.remove()
        const meta = ENTITIES[entity]
        const area = document.createElement('div'); area.id='form-area'; area.className='mt-6 bg-white p-4 rounded shadow'
        const title = document.createElement('h3'); title.className='font-semibold'; title.textContent = (editing? 'Editar ' : 'Criar ') + meta.label
        area.appendChild(title)
        const grid = document.createElement('div'); grid.className='grid grid-cols-2 gap-3 mt-3'
        const inputs = {}
        // build fields (handle async option sources)
        for(const f of meta.fields){
          const { wrapper, input } = buildField(f, '')
          inputs[f.name] = input
          grid.appendChild(wrapper)
        }
        area.appendChild(grid)

        // special UX for `alunos`: show a disabled display input for usuário name
        if(entity === 'alunos'){
          const cpfNode = inputs['cpf']
          const hiddenNode = inputs['id_usuario']
          // lookup function: fetch lists and match cpf client-side (sets id_usuario)
          const lookupByCpf = async (cpf)=>{
            const norm = (cpf||'').replace(/\D/g,'')
            // if no cpf normalized, do not modify current select value — just clear any pending lookup
            if(!norm){ delete hiddenNode.dataset.pending; return }
            try{
              const [alRes, profRes] = await Promise.all([axios.get('/alunos'), axios.get('/professores')])
              const alunos = Array.isArray(alRes.data)? alRes.data : []
              const profs = Array.isArray(profRes.data)? profRes.data : []
              const foundA = alunos.find(a=> (a.cpf||'') === norm)
              if(foundA){
                hiddenNode.dataset.pending = String(foundA.id_usuario || '')
                // do not assign hiddenNode.value now — wait until select options exist
                return
              }
              const foundP = profs.find(p=> (p.cpf||'') === norm)
              if(foundP){
                hiddenNode.dataset.pending = String(foundP.id_usuario || '')
                return
              }
              // no match: remove pending but keep current selection unchanged
              delete hiddenNode.dataset.pending
            }catch(e){ console.error('lookupByCpf', e); delete hiddenNode.dataset.pending }
          }

          if(cpfNode){ cpfNode.addEventListener('blur', ()=> lookupByCpf(cpfNode.value || '')) }
          // when editing, pre-fill id_usuario from editing values
          if(editing){
            if(editing.id_usuario){
              hiddenNode.value = editing.id_usuario
            } else if(editing.cpf) {
              await lookupByCpf(editing.cpf)
            }
          }
        }

        // populate selects that have source and set editing values
        for(const f of meta.fields){
          if(f.type === 'select' && f.source){
            const opts = await fetchOptions(f.source, f.valueKey || f.name, f.labelKey)
            const sel = inputs[f.name]
            sel.innerHTML = ''
            opts.forEach(o=> sel.appendChild(new Option(o.label, o.value)))
            if(sel.dataset.pending){ sel.value = sel.dataset.pending; delete sel.dataset.pending }
            else if(editing && editing[f.name] !== undefined) sel.value = editing[f.name]
          } else {
            if(editing && editing[f.name] !== undefined){
              const node = inputs[f.name]
              if(f.type === 'checkbox') node.checked = Boolean(editing[f.name])
              else {
                try{ node.value = (editing[f.name] === null || editing[f.name] === undefined) ? '' : String(editing[f.name]).toUpperCase() }catch(e){ node.value = editing[f.name] }
              }
            }
          }
        }

        // Special handling for `notas`: ensure `id_avaliacao` shows friendly labels including Turma — Disciplina
        if(entity === 'notas'){
          try{
            const avRes = await axios.get('/avaliacoes')
            const tdRes = await axios.get('/turma-disciplinas')
            const tRes = await axios.get('/turmas')
            const dRes = await axios.get('/disciplinas')
            const avals = Array.isArray(avRes.data)? avRes.data : []
            const tds = Array.isArray(tdRes.data)? tdRes.data : []
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const disciplinas = Array.isArray(dRes.data)? dRes.data : []
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            const tdMap = {}; tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
            const sel = inputs['id_avaliacao']
            if(sel){
              sel.innerHTML = ''
              sel.appendChild(new Option('Selecione uma avaliação',''))
              avals.forEach(av=>{
                const td = tdMap[av.id_turma_disciplina]
                const turmaNome = td? (tMap[td.id_turma] || '') : ''
                const discNome = td? (dMap[td.id_disciplina] || '') : ''
                const tdLabel = (turmaNome && discNome) ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || '')
                const label = (av.descricao ? av.descricao : '') + (tdLabel ? (' — ' + tdLabel) : '')
                const val = av.id_avaliacao || av.id
                sel.appendChild(new Option(label || String(val), val))
              })
              // if editing, try to set the existing value
              if(editing && editing.id_avaliacao) try{ sel.value = editing.id_avaliacao }catch(e){}
            }
          }catch(e){ console.error('populate notas avaliacao select', e) }
        }

        // For alunos: if a pending id was set before options existed, ensure it survives later input changes
        if(entity === 'alunos'){
          const userSel = inputs['id_usuario']
          if(userSel){
            Object.keys(inputs).forEach(k=>{
              const node = inputs[k]
              if(node && typeof node.addEventListener === 'function'){
                node.addEventListener('change', ()=>{
                  if(userSel.dataset && userSel.dataset.pending && (userSel.value === '' || userSel.value === undefined)){
                    const pending = userSel.dataset.pending
                    const hasOption = Array.from(userSel.options || []).some(o=> String(o.value) === String(pending))
                    if(hasOption){
                      try{ userSel.value = pending }catch(e){}
                      delete userSel.dataset.pending
                    }
                  }
                })
              }
            })
          }
        }

        // For matriculas: when creating a new matricula, default the date to today and disable the field
        if(entity === 'matriculas' && !editing){
          try{
            const dateNode = inputs['data_matricula']
            if(dateNode){
              const today = new Date();
              const iso = today.toISOString().slice(0,10)
              dateNode.value = iso
              dateNode.disabled = true
            }
          }catch(e){ console.warn('Could not set default data_matricula', e) }
        }

        // dynamic behavior for frequencias form: when turma-disciplina changes, limit matricula options to that turma
        if(entity === 'frequencias'){
          try{
            const tdSel = inputs['id_turma_disciplina']
            const matSel = inputs['id_matricula']
            const [tdRes, mRes, aRes, uRes] = await Promise.all([axios.get('/turma-disciplinas'), axios.get('/matriculas'), axios.get('/alunos'), axios.get('/usuarios')])
            const tds = Array.isArray(tdRes.data)? tdRes.data : []
            const mats = Array.isArray(mRes.data)? mRes.data : []
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tdMap = {};
            tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)

            const rebuildMatOptions = (selectedTdId)=>{
              matSel.innerHTML = ''
              const filtered = selectedTdId ? mats.filter(m=> String(m.id_turma) === String(tdMap[selectedTdId].id_turma)) : mats
              filtered.forEach(m=>{
                const aluno = aMap[m.id_aluno]
                const label = aluno? (uMap[aluno.id_usuario] || aluno.cpf) : String(m.id_matricula)
                matSel.appendChild(new Option(label, m.id_matricula))
              })
            }

            // initial build (respect editing value)
            rebuildMatOptions(tdSel.value || undefined)
            if(editing && editing.id_matricula) matSel.value = editing.id_matricula

            tdSel.addEventListener('change', ()=> rebuildMatOptions(tdSel.value || undefined))
          }catch(e){ console.error('frequencias form dynamic', e) }
        }

        const btnSave = document.createElement('button'); btnSave.className='px-3 py-1 bg-schoolBlue-500 text-white rounded mr-2'; btnSave.textContent='Salvar'
        btnSave.addEventListener('click', async ()=>{
          // normalize inputs to uppercase before reading values
          try{ const allInputs = area.querySelectorAll('input'); allInputs.forEach(i=>{ try{ const t = (i.type||'').toLowerCase(); if(t !== 'password' && t !== 'date' && t !== 'number' && t !== 'checkbox' && t !== 'email') i.value = (i.value||'').toUpperCase() }catch(e){} }) }catch(e){}
          const payload = {}
          meta.fields.forEach(f=>{
            const node = inputs[f.name]
            let val
            if(f.type === 'checkbox') val = Boolean(node.checked)
            else {
              val = node.value
              if((val === '' || val === undefined) && node && node.dataset && node.dataset.pending) val = node.dataset.pending
            }
            payload[f.name] = val
          })
          try{
            if(editing){
              // find id key
              const idKey = Object.keys(editing).find(k=>k.startsWith('id_')) || 'id'
              await axios.put('/' + entity + '/' + editing[idKey], payload)
              toast('Atualizado com sucesso')
            }else{
              await axios.post('/' + entity, payload)
              toast('Criado com sucesso')
            }
            // refresh list
            await loadAndRender(entity)
            // remove form
            area.remove()
          }catch(err){ console.error(err); toast('Erro ao salvar: ' + (err.response? err.response.status : err.message), true) }
        })
        const btnCancel = document.createElement('button'); btnCancel.className='px-3 py-1 bg-slate-100 rounded'; btnCancel.textContent='Cancelar'; btnCancel.addEventListener('click', ()=> area.remove())
        const actions = document.createElement('div'); actions.className='mt-3'; actions.appendChild(btnSave); actions.appendChild(btnCancel)
        area.appendChild(actions)
        content.appendChild(area)
      }

      async function removeItem(entity, item){
        if(!confirm('Remover?')) return
        const idKey = Object.keys(item).find(k=>k.startsWith('id_')) || 'id'
        try{
          await axios.delete('/' + entity + '/' + item[idKey])
          toast('Removido')
          await loadAndRender(entity)
        }catch(err){ console.error(err); toast('Erro ao remover', true) }
      }

      // init
      createMenu()
      // auto-open first
      openEntity(Object.keys(ENTITIES)[0])
    })()
    </script>
  </body>
</html>
