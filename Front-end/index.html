<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escola360 - Frontend (single-file)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind theme extension for school palette
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              schoolBlue: {
                50: '#f3f8fb',
                100: '#e6f1f8',
                500: '#0f6aa8',
                700: '#0b4f7a'
              },
              schoolGreen: {
                50: '#f3fbf6',
                500: '#14a76c'
              },
              softPurple: '#8b6acb'
            }
          }
        }
      }

      function toast(msg, error=false){
        if(!document.body){ return setTimeout(()=> toast(msg,error), 100) }
        console.log(msg)
        const el = document.createElement('div')
        el.className = 'fixed bottom-4 right-4 bg-white border p-3 rounded shadow'
        if(error) el.classList.add('text-red-600')
        el.textContent = msg
        document.body.appendChild(el)
        setTimeout(()=> el.remove(), 4000)
      }

      async function safeLoadAndRender(entity, filters={}){
        try{ if(typeof loadAndRender === 'function') return await loadAndRender(entity, filters) }catch(e){}
      }

      async function showUnifiedForm(opts={}){
        // remove existing form
        const existing = document.getElementById('form-area'); if(existing) existing.remove()
        const area = document.createElement('div'); area.id='form-area'; area.className='mt-6 bg-white p-4 rounded shadow'
        const title = document.createElement('h3'); title.className='font-semibold'; title.textContent = 'DADOS PESSOAIS E ENDEREÇO'
        area.appendChild(title)

        const grid = document.createElement('div'); grid.className='grid grid-cols-2 gap-3 mt-3'

        // Tipo: aluno ou professor (quando aplicável)
        const tipoWrap = document.createElement('div'); tipoWrap.className='flex flex-col'
        const tipoLabel = document.createElement('label'); tipoLabel.className='text-xs text-slate-600 mb-1'; tipoLabel.textContent='Tipo'
        const tipoSel = document.createElement('select'); tipoSel.className='border rounded px-2 py-1'; tipoSel.id='un_tipo'
        tipoSel.appendChild(new Option('Aluno','aluno'))
        tipoSel.appendChild(new Option('Professor','professor'))
        // input disabled variant used when the form is specifically for 'aluno'
        const tipoDisabled = document.createElement('input'); tipoDisabled.type = 'text'; tipoDisabled.className = 'border rounded px-2 py-1 bg-slate-100'; tipoDisabled.disabled = true; tipoDisabled.id = 'un_tipo_disabled'; tipoDisabled.value = 'ESTUDANTE'
        // if opts.tipo is provided and is one of the selectable values, pre-select it
        if(opts && (opts.tipo === 'aluno' || opts.tipo === 'professor')){ try{ tipoSel.value = opts.tipo }catch(e){} }
        // hide tipo selector when opening specifically for 'usuario' or 'professor'
        if(opts && (opts.tipo === 'usuario' || opts.tipo === 'professor')) tipoWrap.style.display = 'none'
        // append disabled input when this is the aluno form, otherwise show select
        tipoWrap.appendChild(tipoLabel);
        if(opts && opts.tipo === 'aluno'){ tipoWrap.appendChild(tipoDisabled) } else { tipoWrap.appendChild(tipoSel) }
        grid.appendChild(tipoWrap)

        // Usuario fields
        const nomeWrap = document.createElement('div'); nomeWrap.className='flex flex-col'
        const nomeLabel = document.createElement('label'); nomeLabel.className='text-xs text-slate-600 mb-1'; nomeLabel.textContent='Nome'
        const nomeInp = document.createElement('input'); nomeInp.className='border rounded px-2 py-1'; nomeInp.id='un_nome'
        nomeWrap.appendChild(nomeLabel); nomeWrap.appendChild(nomeInp); grid.appendChild(nomeWrap)

        const emailWrap = document.createElement('div'); emailWrap.className='flex flex-col'
        const emailLabel = document.createElement('label'); emailLabel.className='text-xs text-slate-600 mb-1'; emailLabel.textContent='Email'
        const emailInp = document.createElement('input'); emailInp.type='email'; emailInp.className='border rounded px-2 py-1'; emailInp.id='un_email'
        emailWrap.appendChild(emailLabel); emailWrap.appendChild(emailInp); grid.appendChild(emailWrap)

        const rgWrap = document.createElement('div'); rgWrap.className='flex flex-col'
        const rgLabel = document.createElement('label'); rgLabel.className='text-xs text-slate-600 mb-1'; rgLabel.textContent='RG'
        const rgInp = document.createElement('input'); rgInp.className='border rounded px-2 py-1'; rgInp.id='un_rg'
        rgWrap.appendChild(rgLabel); rgWrap.appendChild(rgInp); grid.appendChild(rgWrap)

        const cpfUsuarioWrap = document.createElement('div'); cpfUsuarioWrap.className='flex flex-col'
        const cpfUsuarioLabel = document.createElement('label'); cpfUsuarioLabel.className='text-xs text-slate-600 mb-1'; cpfUsuarioLabel.textContent='CPF (usuário)'
        const cpfUsuarioInp = document.createElement('input'); cpfUsuarioInp.className='border rounded px-2 py-1'; cpfUsuarioInp.id='un_cpf_usuario'
        cpfUsuarioWrap.appendChild(cpfUsuarioLabel); cpfUsuarioWrap.appendChild(cpfUsuarioInp); grid.appendChild(cpfUsuarioWrap)

        const senhaWrap = document.createElement('div'); senhaWrap.className='flex flex-col'
        const senhaLabel = document.createElement('label'); senhaLabel.className='text-xs text-slate-600 mb-1'; senhaLabel.textContent='Senha'
        const senhaInp = document.createElement('input'); senhaInp.type='password'; senhaInp.className='border rounded px-2 py-1'; senhaInp.id='un_senha'
        senhaWrap.appendChild(senhaLabel); senhaWrap.appendChild(senhaInp); grid.appendChild(senhaWrap)

        const ativoWrap = document.createElement('div'); ativoWrap.className='flex items-center gap-2'
        const ativoInp = document.createElement('input'); ativoInp.type='checkbox'; ativoInp.id='un_ativo'; ativoInp.className='h-4 w-4'
        const ativoLabel = document.createElement('label'); ativoLabel.className='text-xs text-slate-600'; ativoLabel.textContent='Ativo'
        ativoWrap.appendChild(ativoInp); ativoWrap.appendChild(ativoLabel); grid.appendChild(ativoWrap)

        // Tipos de Perfil (somente para usuarios do sistema) - será populado abaixo quando necessario
        const perfisWrap = document.createElement('div'); perfisWrap.className='flex flex-col'
        const perfisLabel = document.createElement('label'); perfisLabel.className='text-xs text-slate-600 mb-1'; perfisLabel.textContent='Tipos de Perfil'
        const perfisSelect = document.createElement('select'); perfisSelect.id = 'un_perfis'; perfisSelect.className = 'border rounded px-2 py-1'; perfisSelect.size = 1
        const perfisDisabled = document.createElement('input'); perfisDisabled.type = 'text'; perfisDisabled.className = 'border rounded px-2 py-1 bg-slate-100'; perfisDisabled.disabled = true; perfisDisabled.id = 'un_perfil_disabled'; perfisDisabled.style.display = 'none'
        // id for preset perfil when using Cadastro de Responsáveis
        let presetPerfilId = null
        perfisWrap.appendChild(perfisLabel); perfisWrap.appendChild(perfisSelect); perfisWrap.appendChild(perfisDisabled); grid.appendChild(perfisWrap)

        // Common document fields (single CPF field: use CPF (usuário) only)

        const dataNascWrap = document.createElement('div'); dataNascWrap.className='flex flex-col'
        const dataNascLabel = document.createElement('label'); dataNascLabel.className='text-xs text-slate-600 mb-1'; dataNascLabel.textContent='Data Nascimento'
        const dataNascInp = document.createElement('input'); dataNascInp.type='date'; dataNascInp.className='border rounded px-2 py-1'; dataNascInp.id='un_data_nascimento'
        dataNascWrap.appendChild(dataNascLabel); dataNascWrap.appendChild(dataNascInp); grid.appendChild(dataNascWrap)

        const nomeMaeWrap = document.createElement('div'); nomeMaeWrap.className='flex flex-col'
        const nomeMaeLabel = document.createElement('label'); nomeMaeLabel.className='text-xs text-slate-600 mb-1'; nomeMaeLabel.textContent='Nome da Mãe'
        const nomeMaeInp = document.createElement('input'); nomeMaeInp.className='border rounded px-2 py-1'; nomeMaeInp.id='un_nome_mae'
        nomeMaeWrap.appendChild(nomeMaeLabel); nomeMaeWrap.appendChild(nomeMaeInp); grid.appendChild(nomeMaeWrap)

        const nomePaiWrap = document.createElement('div'); nomePaiWrap.className='flex flex-col'
        const nomePaiLabel = document.createElement('label'); nomePaiLabel.className='text-xs text-slate-600 mb-1'; nomePaiLabel.textContent='Nome do Pai'
        const nomePaiInp = document.createElement('input'); nomePaiInp.className='border rounded px-2 py-1'; nomePaiInp.id='un_nome_pai'
        nomePaiWrap.appendChild(nomePaiLabel); nomePaiWrap.appendChild(nomePaiInp); grid.appendChild(nomePaiWrap)

        const sexoWrap = document.createElement('div'); sexoWrap.className='flex flex-col'
        const sexoLabel = document.createElement('label'); sexoLabel.className='text-xs text-slate-600 mb-1'; sexoLabel.textContent='Sexo'
        const sexoSel = document.createElement('select'); sexoSel.className='border rounded px-2 py-1'; sexoSel.id='un_sexo'
        sexoSel.appendChild(new Option('',''))
        sexoSel.appendChild(new Option('M','M'))
        sexoSel.appendChild(new Option('F','F'))
        sexoWrap.appendChild(sexoLabel); sexoWrap.appendChild(sexoSel); grid.appendChild(sexoWrap)

        const dataAdmWrap = document.createElement('div'); dataAdmWrap.className='flex flex-col'
        const dataAdmLabel = document.createElement('label'); dataAdmLabel.className='text-xs text-slate-600 mb-1'; dataAdmLabel.textContent='Data Admissão (professor)'
        const dataAdmInp = document.createElement('input'); dataAdmInp.type='date'; dataAdmInp.className='border rounded px-2 py-1'; dataAdmInp.id='un_data_admissao'
        dataAdmWrap.appendChild(dataAdmLabel); dataAdmWrap.appendChild(dataAdmInp); grid.appendChild(dataAdmWrap)

        // Address fields
        const cepWrap = document.createElement('div'); cepWrap.className='flex flex-col'
        const cepLabel = document.createElement('label'); cepLabel.className='text-xs text-slate-600 mb-1'; cepLabel.textContent='CEP'
        const cepInp = document.createElement('input'); cepInp.className='border rounded px-2 py-1'; cepInp.id='un_cep'
        cepWrap.appendChild(cepLabel); cepWrap.appendChild(cepInp)
        const cepStatus = document.createElement('div'); cepStatus.className = 'text-xs text-slate-500 mt-1'; cepStatus.style.minHeight = '1rem'
        cepWrap.appendChild(cepStatus);
        grid.appendChild(cepWrap)
        // id of existing endereco when editing
        let existingEnderecoId = null

        const logWrap = document.createElement('div'); logWrap.className='flex flex-col'
        const logLabel = document.createElement('label'); logLabel.className='text-xs text-slate-600 mb-1'; logLabel.textContent='Logradouro'
        const logInp = document.createElement('input'); logInp.className='border rounded px-2 py-1'; logInp.id='un_logradouro'
        logWrap.appendChild(logLabel); logWrap.appendChild(logInp); grid.appendChild(logWrap)

        const compWrap = document.createElement('div'); compWrap.className='flex flex-col'
        const compLabel = document.createElement('label'); compLabel.className='text-xs text-slate-600 mb-1'; compLabel.textContent='Complemento'
        const compInp = document.createElement('input'); compInp.className='border rounded px-2 py-1'; compInp.id='un_complemento'
        compWrap.appendChild(compLabel); compWrap.appendChild(compInp); grid.appendChild(compWrap)

        const numeroWrap = document.createElement('div'); numeroWrap.className='flex flex-col'
        const numeroLabel = document.createElement('label'); numeroLabel.className='text-xs text-slate-600 mb-1'; numeroLabel.textContent='Número'
        const numeroInp = document.createElement('input'); numeroInp.className='border rounded px-2 py-1'; numeroInp.id='un_numero'
        numeroWrap.appendChild(numeroLabel); numeroWrap.appendChild(numeroInp); grid.appendChild(numeroWrap)

        const bairroWrap = document.createElement('div'); bairroWrap.className='flex flex-col'
        const bairroLabel = document.createElement('label'); bairroLabel.className='text-xs text-slate-600 mb-1'; bairroLabel.textContent='Bairro'
        const bairroInp = document.createElement('input'); bairroInp.className='border rounded px-2 py-1'; bairroInp.id='un_bairro'
        bairroWrap.appendChild(bairroLabel); bairroWrap.appendChild(bairroInp); grid.appendChild(bairroWrap)

        const ufWrap = document.createElement('div'); ufWrap.className='flex flex-col'
        const ufLabel = document.createElement('label'); ufLabel.className='text-xs text-slate-600 mb-1'; ufLabel.textContent='UF'
        const ufInp = document.createElement('input'); ufInp.className='border rounded px-2 py-1'; ufInp.id='un_uf'
        ufWrap.appendChild(ufLabel); ufWrap.appendChild(ufInp); grid.appendChild(ufWrap)

        const cidadeWrap = document.createElement('div'); cidadeWrap.className='flex flex-col'
        const cidadeLabel = document.createElement('label'); cidadeLabel.className='text-xs text-slate-600 mb-1'; cidadeLabel.textContent='Cidade'
        const cidadeInp = document.createElement('input'); cidadeInp.className='border rounded px-2 py-1'; cidadeInp.id='un_cidade'
        cidadeWrap.appendChild(cidadeLabel); cidadeWrap.appendChild(cidadeInp); grid.appendChild(cidadeWrap)

        area.appendChild(grid)

        // helper: enforce uppercase display and input normalization for text-like inputs
        function enforceUppercaseForInput(input){
          try{
            if(!input) return
            const t = (input.type || '').toLowerCase()
            if(t === 'password' || t === 'date' || t === 'number' || t === 'checkbox') return
            input.style.textTransform = 'uppercase'
            // convert existing value (prefill) to uppercase for consistency
            try{ if(typeof input.value === 'string') input.value = input.value.toUpperCase() }catch(e){}
            input.addEventListener('input', ()=>{ try{ input.value = input.value.toUpperCase() }catch(e){} })
          }catch(e){}
        }
        // apply to known inputs
        enforceUppercaseForInput(nomeInp)
        // email should not be forced to uppercase
        enforceUppercaseForInput(rgInp)
        enforceUppercaseForInput(cpfUsuarioInp)
        enforceUppercaseForInput(nomeMaeInp)
        enforceUppercaseForInput(nomePaiInp)
        enforceUppercaseForInput(logInp)
        enforceUppercaseForInput(compInp)
        enforceUppercaseForInput(numeroInp)
        enforceUppercaseForInput(bairroInp)
        enforceUppercaseForInput(ufInp)
        enforceUppercaseForInput(cidadeInp)

        // show/hide fields depending on tipo (respect opts.tipo when provided)
        function refreshTipo(){
          const tipo = (opts && opts.tipo) ? opts.tipo : tipoSel.value
          dataNascWrap.style.display = tipo === 'aluno' ? '' : 'none'
          cpfUsuarioWrap.style.display = (tipo === 'aluno' || tipo === 'professor' || tipo === 'usuario') ? '' : 'none'
          dataAdmWrap.style.display = tipo === 'professor' ? '' : 'none'
          // show parent's name and sexo only for alunos
          nomeMaeWrap.style.display = tipo === 'aluno' ? '' : 'none'
          nomePaiWrap.style.display = tipo === 'aluno' ? '' : 'none'
          sexoWrap.style.display = tipo === 'aluno' ? '' : 'none'
          // show responsáveis only for alunos
          try{ responsaveisSection.style.display = tipo === 'aluno' ? '' : 'none' }catch(e){}
        }
        tipoSel.addEventListener('change', refreshTipo)
        refreshTipo()

        // ViaCEP lookup: fill address fields when CEP is entered
        let cepTimer
        cepInp.addEventListener('input', ()=>{ cepStatus.textContent=''; clearTimeout(cepTimer); cepTimer = setTimeout(runCepLookup, 600) })
        cepInp.addEventListener('blur', runCepLookup)
        async function runCepLookup(){
          const raw = (cepInp.value || '').replace(/\D/g,'')
          if(!raw || raw.length !== 8) return
          cepStatus.textContent = 'Consultando CEP...'
          try{
            const res = await axios.get('https://viacep.com.br/ws/' + raw + '/json/')
            const data = res.data
            if(!data || data.erro){ cepStatus.textContent = 'CEP não encontrado'; cepStatus.className = 'text-xs text-red-600 mt-1'; return }
            logInp.value = (data.logradouro || '').toUpperCase()
            compInp.value = (data.complemento || '').toUpperCase()
            bairroInp.value = (data.bairro || '').toUpperCase()
            ufInp.value = (data.uf || '').toUpperCase()
            cidadeInp.value = (data.localidade || '').toUpperCase()
            cepStatus.textContent = ''
            cepStatus.className = 'text-xs text-slate-500 mt-1'
          }catch(e){ console.error('viacep', e); cepStatus.textContent = 'Erro ao consultar CEP'; cepStatus.className = 'text-xs text-red-600 mt-1' }
        }

        // Responsáveis (apenas para tipo aluno) — simplified: CPF lookup + nome preenchido
        const responsaveisSection = document.createElement('div'); responsaveisSection.className = 'mt-4 col-span-2'
        const respTitle = document.createElement('h4'); respTitle.className = 'font-semibold text-sm mb-2'; respTitle.textContent = 'Responsáveis (opcional)'
        responsaveisSection.appendChild(respTitle)

        // list of pending responsaveis
        const respList = document.createElement('ul'); respList.className = 'mb-2 list-disc pl-5 text-sm text-slate-700'
        responsaveisSection.appendChild(respList)

        // input: CPF to lookup existing user and Name display (auto-filled)
        const lookupWrap = document.createElement('div'); lookupWrap.className = 'flex gap-2 items-end mb-2'
        const cpfResp = document.createElement('input'); cpfResp.placeholder = 'CPF do responsável'; cpfResp.className='border rounded px-2 py-1'; cpfResp.style.minWidth='200px'
        const nomeResp = document.createElement('input'); nomeResp.placeholder = 'Nome (preenchido)'; nomeResp.className='border rounded px-2 py-1 flex-1'; nomeResp.readOnly = true
        const addRespBtn = document.createElement('button'); addRespBtn.className='px-2 py-1 bg-slate-100 rounded text-sm'; addRespBtn.textContent='Adicionar'
        lookupWrap.appendChild(cpfResp); lookupWrap.appendChild(nomeResp); lookupWrap.appendChild(addRespBtn)
        responsaveisSection.appendChild(lookupWrap)

        const pendingResponsaveis = []
        function refreshRespList(){
          respList.innerHTML = ''
          pendingResponsaveis.forEach((r, idx)=>{
            const li = document.createElement('li'); li.textContent = (r.nome || ('#' + r.id_usuario)) + (r.cpf ? (' — ' + r.cpf) : '')
            const rem = document.createElement('button'); rem.className='ml-2 text-red-600 text-xs'; rem.textContent='Remover'; rem.addEventListener('click', ()=>{ pendingResponsaveis.splice(idx,1); refreshRespList() })
            li.appendChild(rem); respList.appendChild(li)
          })
        }

        // lookup by CPF: search in usuarios by cpf (cpf moved to tb_usuarios)
        async function lookupResponsavelByCpf(){
          const raw = (cpfResp.value || '').replace(/\D/g,'')
          nomeResp.value = ''
          if(!raw || raw.length !== 11) return
          try{
            const uRes = await axios.get('/usuarios')
            const users = Array.isArray(uRes.data)? uRes.data : []
            const found = users.find(u => ((u.cpf||'') === raw) || ((String(u.cpf||'')).replace(/\D/g,'') === raw))
            if(found) nomeResp.value = found.nome || ''
          }catch(e){ console.error('lookupResponsavelByCpf', e) }
        }

        // If this form is for 'usuario' (or aluno/professor/cadastroResponsaveis), load perfis and build options
        if(opts && (opts.tipo === 'usuario' || opts.tipo === 'professor' || opts.cadastroResponsave || opts.tipo === 'aluno')){
          try{
            const pRes = await axios.get('/perfis')
            const perfis = Array.isArray(pRes.data)? pRes.data : []
            perfisSelect.innerHTML = ''
            // when cadastroResponsaveis, preset to RESPONSAVEL and show disabled input
            if(opts.cadastroResponsaveis){
              const found = perfis.find(pp=> String((pp.nome||'').toUpperCase()) === 'RESPONSAVEL' || String((pp.nome||'').toUpperCase()) === 'RESPONSÁVEL')
              if(found){
                presetPerfilId = found.id_perfil || found.id
                try{ perfisDisabled.value = found.nome }catch(e){}
                perfisDisabled.style.display = ''
                perfisSelect.style.display = 'none'
              } else {
                perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) })
              }
            } else if(opts.tipo === 'professor'){
              // preset to PROFESSOR for professor forms
              const found = perfis.find(pp=> String((pp.nome||'').toUpperCase()) === 'PROFESSOR')
              if(found){ presetPerfilId = found.id_perfil || found.id; try{ perfisDisabled.value = found.nome }catch(e){}; perfisDisabled.style.display = ''; perfisSelect.style.display = 'none' }
              else { perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) }) }
            } else if(opts.tipo === 'aluno'){
              // preset to ESTUDANTE (or ALUNO) for aluno forms
              const found = perfis.find(pp=> {
                const n = String((pp.nome||'').toUpperCase())
                return n === 'ESTUDANTE' || n === 'ALUNO'
              })
              if(found){ presetPerfilId = found.id_perfil || found.id; try{ perfisDisabled.value = found.nome }catch(e){}; perfisDisabled.style.display = ''; perfisSelect.style.display = 'none' }
              else { perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) }) }
            } else {
              perfis.forEach(p=>{ const id = p.id_perfil || p.id; const o = document.createElement('option'); o.value = id; o.textContent = p.nome || p.nome; perfisSelect.appendChild(o) })
            }
          }catch(e){ console.error('load perfis', e) }
        } else {
          // hide perfis control for non-usuarios and non-professores
          perfisWrap.style.display = 'none'
        }

        cpfResp.addEventListener('blur', lookupResponsavelByCpf)
        cpfResp.addEventListener('input', ()=>{ nomeResp.value = '' })

        addRespBtn.addEventListener('click', async ()=>{
          const raw = (cpfResp.value || '').replace(/\D/g,'')
          if(!raw || raw.length !== 11){ toast('CPF inválido', true); return }
          // attempt lookup; if not found, warn
          await lookupResponsavelByCpf()
          if(!nomeResp.value){ toast('Usuário com esse CPF não encontrado', true); return }
          // find usuario id by cpf in usuarios
          try{
            const uRes = await axios.get('/usuarios')
            const users = Array.isArray(uRes.data)? uRes.data : []
            const foundUser = users.find(u => ((u.cpf||'') === raw) || ((String(u.cpf||'')).replace(/\D/g,'') === raw))
            if(!foundUser){ toast('Usuário não encontrado para vincular', true); return }
            const userId = foundUser.id_usuario || foundUser.id
            if(pendingResponsaveis.some(p=> String(p.id_usuario) === String(userId))){ toast('Responsável já adicionado', true); return }
            pendingResponsaveis.push({ id_usuario: userId, nome: (foundUser.nome || nomeResp.value), cpf: raw })
            refreshRespList()
            cpfResp.value=''; nomeResp.value=''
          }catch(e){ console.error('add responsavel', e); toast('Erro ao adicionar responsável', true) }
        })

        // attach responsaveis section (only visible for alunos)
        try{
          const currentTipo = (opts && opts.tipo) ? opts.tipo : tipoSel.value
          // show responsaveis section only for alunos
          responsaveisSection.style.display = (currentTipo === 'aluno') ? '' : 'none'
        }catch(e){}
        area.appendChild(responsaveisSection)

        // If editing, prefill fields (usuario, aluno/professor specific, endereco, responsaveis)
        if(opts && opts.editing){
          (async ()=>{
            const ed = opts.editing || {}
            try{
              // populate usuario fields from id_usuario if available
                  if(ed.id_usuario){
                    try{
                      const uRes = await axios.get('/usuarios')
                      const users = Array.isArray(uRes.data)? uRes.data : []
                      const u = users.find(x=> String(x.id_usuario) === String(ed.id_usuario))
                      if(u){ nomeInp.value = u.nome || ''; emailInp.value = u.email || ''; ativoInp.checked = Boolean(u.ativo)
                        // preselect perfis if present (radio inputs)
                        try{
                          const selected = u._perfis || (ed._perfis || [])
                          const selIds = Array.isArray(selected) ? selected.map(x=> Number(x.id_perfil || x || x.id || x)) : []
                          if(selIds.length){
                            const target = String(selIds[0])
                            try{ perfisSelect.value = target }catch(e){}
                          }
                        }catch(e){}
                      }
                    }catch(e){}
                  } else if(ed.nome){ nomeInp.value = ed.nome }

                // usuario-level cpf/rg now stored on tb_usuarios
                try{ if(u){ cpfUsuarioInp.value = u.cpf || '' ; rgInp.value = u.rg || '' } }catch(e){}
                if(ed.data_nascimento) dataNascInp.value = ed.data_nascimento
              if(ed.data_admissao) dataAdmInp.value = ed.data_admissao

              // endereco: find first endereco for this usuario
              if(ed.id_usuario){
                try{
                  const eRes = await axios.get('/enderecos')
                  const ends = Array.isArray(eRes.data)? eRes.data : []
                  const my = ends.find(x=> String(x.tb_usuarios_id_usuario) === String(ed.id_usuario))
                  if(my){ existingEnderecoId = my.id_endereco || my.id || my.id_endereco || null; cepInp.value = my.cep || ''; logInp.value = my.logradouro || ''; compInp.value = my.complemento || ''; numeroInp.value = my.numero || ''; bairroInp.value = my.bairro || ''; ufInp.value = my.uf || ''; cidadeInp.value = my.cidade || '' }
                }catch(e){}
              }

              // responsaveis: if editing an aluno, load existing links
              if(ed.id_aluno){
                try{
                  const rRes = await axios.get('/responsaveis', { params: { alunoId: ed.id_aluno } })
                  const links = Array.isArray(rRes.data)? rRes.data : []
                  if(links.length){
                    try{
                      const uRes = await axios.get('/usuarios')
                      const users = Array.isArray(uRes.data)? uRes.data : []
                      links.forEach(l=>{
                        const u = users.find(x=> String(x.id_usuario) === String(l.tb_usuarios_id_usuario))
                        pendingResponsaveis.push({ id_usuario: l.tb_usuarios_id_usuario, nome: u? u.nome : String(l.tb_usuarios_id_usuario), cpf: l.cpf || '' })
                      })
                      refreshRespList()
                    }catch(e){}
                  }
                }catch(e){}
              }
              // prefill aluno extra fields
              try{ if(ed.nome_mae) nomeMaeInp.value = ed.nome_mae }catch(e){}
              try{ if(ed.nome_pai) nomePaiInp.value = ed.nome_pai }catch(e){}
              try{ if(ed.sexo) sexoSel.value = ed.sexo }catch(e){}
            }catch(e){ console.error('prefill unified form', e) }
            // after prefill, ensure displayed values are uppercase
            try{
              const allInputs = area.querySelectorAll('input')
              allInputs.forEach(i=>{ try{ const t = (i.type||'').toLowerCase(); if(t !== 'password' && t !== 'date' && t !== 'number' && t !== 'checkbox' && t !== 'email') i.value = (i.value||'').toUpperCase() }catch(e){} })
            }catch(e){}
          })()
        }

        const btnSave = document.createElement('button'); btnSave.className='px-3 py-1 bg-schoolBlue-500 text-white rounded mr-2'; btnSave.textContent='Salvar'
        const statusDiv = document.createElement('div'); statusDiv.className = 'mt-3 text-sm'
        btnSave.addEventListener('click', async ()=>{
          // normalize all non-password/date/number inputs to uppercase before reading values
          try{
            const allInputs = area.querySelectorAll('input')
            allInputs.forEach(i=>{ try{ const t = (i.type||'').toLowerCase(); if(t !== 'password' && t !== 'date' && t !== 'number' && t !== 'checkbox' && t !== 'email') i.value = (i.value||'').toUpperCase() }catch(e){} })
          }catch(e){}
          const tipo = (opts && opts.tipo) ? opts.tipo : tipoSel.value
          const usuarioPayload = { nome: nomeInp.value, email: emailInp.value }
          try{ if(cpfUsuarioInp && cpfUsuarioInp.value) usuarioPayload.cpf = (cpfUsuarioInp.value||'').replace(/\D/g,'') }catch(e){}
          try{ if(rgInp && rgInp.value) usuarioPayload.rg = rgInp.value }catch(e){}
          if(senhaInp.value) usuarioPayload.senha = senhaInp.value
          usuarioPayload.ativo = ativoInp.checked
          // include perfis when visible
          try{
            if(perfisWrap.style.display !== 'none'){
              if((opts && opts.cadastroResponsaveis && presetPerfilId) || (opts && opts.tipo === 'professor' && presetPerfilId) || (opts && opts.tipo === 'aluno' && presetPerfilId)){
                usuarioPayload.perfis = [ Number(presetPerfilId) ]
              } else {
                const v = perfisSelect.value
                if(v) usuarioPayload.perfis = [ Number(v) ]
              }
            }
          }catch(e){}
          // disable while saving
          btnSave.disabled = true; btnSave.textContent = 'Salvando...'; statusDiv.textContent = ''
          try{
            // create or update usuario
            const isEditing = opts && opts.editing
            let uRes
            if(isEditing){
              const userId = opts.editing.id_usuario || opts.editing.id
              uRes = await axios.put('/usuarios/' + userId, usuarioPayload)
            } else {
              uRes = await axios.post('/usuarios', usuarioPayload)
            }
            const user = uRes.data || {}
            const id_usuario = user.id_usuario || user.id || user.id_usuario
            if(!id_usuario) throw new Error('Usuário criado sem id_usuario')

            // create or update aluno/professor when applicable
            let createdAlunoId = null
            if(tipo === 'aluno'){
              const alunoPayload = { id_usuario: id_usuario, data_nascimento: dataNascInp.value || null, nome_mae: (typeof nomeMaeInp !== 'undefined' ? nomeMaeInp.value : null), nome_pai: (typeof nomePaiInp !== 'undefined' ? nomePaiInp.value : null), sexo: (typeof sexoSel !== 'undefined' ? sexoSel.value : null) }
              if(opts && opts.editing && (opts.editing.id_aluno || opts.editing.id)){
                const aid = opts.editing.id_aluno || opts.editing.id
                try{ await axios.put('/alunos/' + aid, alunoPayload) }catch(e){ console.error('update aluno', e) }
                createdAlunoId = aid
              } else {
                const aRes = await axios.post('/alunos', alunoPayload)
                const aData = aRes.data || {}
                createdAlunoId = aData.id_aluno || aData.id || aData.id_aluno
              }
            } else if(tipo === 'professor'){
              const profPayload = { id_usuario: id_usuario, data_admissao: dataAdmInp.value || null }
              if(opts && opts.editing && (opts.editing.id_professor || opts.editing.id)){
                const pid = opts.editing.id_professor || opts.editing.id
                try{ await axios.put('/professores/' + pid, profPayload) }catch(e){ console.error('update professor', e) }
              } else {
                try{ await axios.post('/professores', profPayload) }catch(e){}
              }
            } else {
              // tipo === 'usuario' -> do not create aluno/professor
            }

            // create endereco (optional fields allowed)
            const enderecoPayload = {
              tb_usuarios_id_usuario: id_usuario,
              cep: cepInp.value || null,
              logradouro: logInp.value || null,
              complemento: compInp.value || null,
              numero: numeroInp.value || null,
              bairro: bairroInp.value || null,
              uf: ufInp.value || null,
              cidade: cidadeInp.value || null
            }
            // create or update endereco
            try{
              if(isEditing && existingEnderecoId){
                await axios.put('/enderecos/' + existingEnderecoId, enderecoPayload)
              } else {
                await axios.post('/enderecos', enderecoPayload)
              }
            }catch(e){ console.error('save endereco', e) }

            // if there are pending responsaveis and we created an aluno, link them
            if(tipo === 'aluno' && createdAlunoId){
              for(const r of (pendingResponsaveis || [])){
                try{ await axios.post('/responsaveis', { tb_alunos_id_aluno: createdAlunoId, tb_usuarios_id_usuario: r.id_usuario, cpf: (r.cpf||null) }) }catch(e){ console.error('link responsavel', e) }
              }
            }

            // success (contextual message)
            statusDiv.className = 'mt-3 text-sm text-green-600'
            try{
              const action = isEditing ? 'Atualização' : 'Cadastro'
              const entityLabel = (tipo === 'aluno') ? 'aluno' : ((tipo === 'professor') ? 'professor' : 'usuário')
              const successMsg = `${action} de ${entityLabel} realizado com sucesso.`
              statusDiv.textContent = successMsg
              toast(successMsg)
            }catch(e){
              statusDiv.textContent = 'Operação realizada com sucesso.'
              toast('Operação realizada com sucesso')
            }
            // refresh users and relevant lists (use safe wrapper)
            await safeLoadAndRender('usuarios')
            await safeLoadAndRender('alunos')
            await safeLoadAndRender('professores')
            // remove form after short delay so user sees success
            setTimeout(()=> area.remove(), 1200)
          }catch(err){
            console.error('cadastro-responsaveis', err)
            const msg = err && err.response && (err.response.data && (err.response.data.error || err.response.data.message)) ? (err.response.data.error || err.response.data.message) : (err.message || 'Erro no cadastro')
            statusDiv.className = 'mt-3 text-sm text-red-600'
            statusDiv.textContent = 'Erro: ' + msg
            toast('Erro no cadastro: ' + msg, true)
          }finally{
            btnSave.disabled = false; btnSave.textContent = 'Salvar'
          }
        })
        const btnCancel = document.createElement('button'); btnCancel.className='px-3 py-1 bg-slate-100 rounded'; btnCancel.textContent='Cancelar'; btnCancel.addEventListener('click', ()=> area.remove())
        const actions = document.createElement('div'); actions.className='mt-3'; actions.appendChild(btnSave); actions.appendChild(btnCancel)
        area.appendChild(actions)
        area.appendChild(statusDiv)
        content.appendChild(area)
      }
    </script>

    <script>
    (function(){
      const PAGE_SIZE = 5
      const pageState = {}
      const lastLoadedItems = {}
      // enhanced: fetchOptions for FK selects, filters and dynamic selects
      const ENTITIES = {
        'usuarios': { label: 'Usuarios do Sistema', fields: [ {name:'nome',label:'Nome',type:'text'},{name:'email',label:'Email',type:'email'},{name:'senha',label:'Senha',type:'password'},{name:'ativo',label:'Ativo',type:'checkbox'} ] },

        'perfis': { label: 'Tipos de Perfil', fields: [ {name:'nome',label:'Nome',type:'text'} ] },
        'professores': { label: 'Professores', fields: [ {name:'id_usuario',label:'Usuário',type:'select', source:'/usuarios', valueKey:'id_usuario', labelKey:'nome'},{name:'cpf',label:'CPF',type:'text'},{name:'data_admissao',label:'Data Admissão',type:'date'} ] },
        'alunos': { label: 'Alunos', fields: [ {name:'id_usuario',label:'Usuário',type:'select', source:'/usuarios', valueKey:'id_usuario', labelKey:'nome'},{name:'cpf',label:'CPF',type:'text'},{name:'data_nascimento',label:'Data Nasc.',type:'date'} ] },
        'turmas': { label: 'Turmas', fields: [ {name:'nome',label:'Nome',type:'text'},{name:'ano_letivo',label:'Ano Letivo',type:'number'},{name:'turno',label:'Turno',type:'select',options:['MANHA','TARDE','NOITE']},{name:'ativa',label:'Ativa',type:'checkbox'} ] },
        'disciplinas': { label: 'Disciplinas', fields: [ {name:'nome',label:'Nome',type:'text'},{name:'carga_horaria',label:'Carga Horária',type:'number'} ] },
        // show turma name for id_turma and professor name for id_professor
        'turma-disciplinas': { label: 'Turma-Disciplinas', fields: [ {name:'id_turma',label:'Turma',type:'select', source:'/turmas', valueKey:'id_turma', labelKey:'nome'},{name:'id_disciplina',label:'Disciplina',type:'select', source:'/disciplinas', valueKey:'id_disciplina', labelKey:'nome'},{name:'id_professor',label:'Professor',type:'select', source:'/professores', valueKey:'id_professor', labelKey:'_professor_nome'} ] },
        // show aluno name instead of cpf in matricula selectors
        'matriculas': { label: 'Matrículas', fields: [ {name:'id_aluno',label:'Aluno',type:'select', source:'/alunos', valueKey:'id_aluno', labelKey:'_aluno_nome'},{name:'id_turma',label:'Turma',type:'select', source:'/turmas', valueKey:'id_turma', labelKey:'nome'},{name:'data_matricula',label:'Data Matrícula',type:'date'} ] },
        // show turma (name) for turma-disciplina selection
        'avaliacoes': { label: 'Avaliações', fields: [ {name:'id_turma_disciplina',label:'Turma',type:'select', source:'/turma-disciplinas', valueKey:'id_turma_disciplina', labelKey:'_turma_nome'},{name:'descricao',label:'Descrição',type:'text'},{name:'data_avaliacao',label:'Data Avaliação',type:'date'},{name:'peso',label:'Peso',type:'number',step:'0.01'} ] },
        // show aluno name instead of matricula id
        'notas': { label: 'Notas', fields: [ {name:'id_avaliacao',label:'Avaliação',type:'select', source:'/avaliacoes', valueKey:'id_avaliacao', labelKey:'descricao'},{name:'id_matricula',label:'Nome do Aluno',type:'select', source:'/matriculas', valueKey:'id_matricula', labelKey:'_aluno_nome'},{name:'nota',label:'Nota',type:'number',step:'0.01'} ] },
        'frequencias': { label: 'Frequências', fields: [ {name:'id_matricula',label:'Matrícula',type:'select', source:'/matriculas', valueKey:'id_matricula', labelKey:'_aluno_nome'},{name:'id_turma_disciplina',label:'TurmaDisc',type:'select', source:'/turma-disciplinas', valueKey:'id_turma_disciplina', labelKey:'_turma_disciplina'},{name:'data',label:'Data',type:'date'},{name:'status',label:'Status',type:'select',options:['PRESENTE','FALTA','JUSTIFICADO']} ] }
      }

      let apiBase = document.getElementById('apiBase').value.replace(/\/+$/,'')
      const content = document.getElementById('content')
      const menu = document.getElementById('menu')
      const OPTIONS_CACHE = {}

      function setApiClient(){
        apiBase = document.getElementById('apiBase').value.replace(/\/+$/,'')
        axios.defaults.baseURL = apiBase
        toast('API base set to ' + apiBase)
      }

      document.getElementById('btnApplyBase').addEventListener('click', setApiClient)
      axios.defaults.baseURL = apiBase

      function toast(msg, error=false){
        console.log(msg)
        const el = document.createElement('div')
        el.className = 'fixed bottom-4 right-4 bg-white border p-3 rounded shadow'
        if(error) el.classList.add('text-red-600')
        el.textContent = msg
        document.body.appendChild(el)
        setTimeout(()=> el.remove(), 4000)
      }

      async function fetchOptions(source, valueKey='id', labelKey){
        if(!source) return []
        if(OPTIONS_CACHE[source]) return OPTIONS_CACHE[source]
        try{
          const res = await axios.get(source)
          const items = Array.isArray(res.data)? res.data : []

          // helpers to bulk-fetch related entities
          const fetchAll = async (path)=>{
            try{ const r = await axios.get(path); return Array.isArray(r.data)? r.data : [] }catch(e){ return [] }
          }

          let opts = []
          // special cases to build friendly labels without changing the API
          if(source === '/alunos'){
            const users = await fetchAll('/usuarios')
            const uMap = {};
            const uCpf = {};
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_aluno
              const label = uMap[it.id_usuario] || uCpf[it.id_usuario] || String(val)
              return { value: val, label }
            })
          } else if(source === '/professores'){
            const users = await fetchAll('/usuarios')
            const uMap = {};
            const uCpf = {};
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_professor
              const label = uMap[it.id_usuario] || uCpf[it.id_usuario] || String(val)
              return { value: val, label }
            })
          } else if(source === '/turma-disciplinas'){
            const turmas = await fetchAll('/turmas')
            const disciplinas = await fetchAll('/disciplinas')
            const tMap = {}
            turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}
            disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_turma_disciplina
              const turmaNome = tMap[it.id_turma]
              const discNome = dMap[it.id_disciplina]
              const label = (turmaNome && discNome) ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || String(val))
              return { value: val, label }
            })
          } else if(source === '/matriculas'){
            const alunos = await fetchAll('/alunos')
            const users = await fetchAll('/usuarios')
            const aMap = {}
            alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {};
            const uCpf = {};
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            opts = items.map(it=>{
              const val = it[valueKey] ?? it.id_matricula
              const aluno = aMap[it.id_aluno]
              const label = aluno ? (uMap[aluno.id_usuario] || uCpf[aluno.id_usuario] || String(val)) : String(val)
              return { value: val, label }
            })
          } else {
            // default behavior
            opts = items.map(it => {
              const val = it[valueKey] ?? it.id ?? Object.values(it)[0]
              let label = ''
              if(labelKey && it[labelKey]) label = String(it[labelKey])
              else {
                const common = ['nome','descricao','email','cpf']
                const found = common.find(k=> it[k])
                label = found ? String(it[found]) : String(val)
              }
              return { value: val, label }
            })
          }

          // fallback: if no opts built but API returned items, try to pick a sensible string field
          if((!opts || opts.length === 0) && Array.isArray(items) && items.length){
            console.warn('fetchOptions: no friendly label built for', source, '— applying fallback label extraction')
            opts = items.map(it => {
              const val = it[valueKey] ?? it.id ?? Object.values(it)[0]
              // prefer common label keys, case-insensitive
              const prefer = ['nome','descricao','email','cpf']
              let label = ''
              for(const k of prefer){ if(it[k]){ label = String(it[k]); break } }
              if(!label){
                // find first string property
                for(const k of Object.keys(it)){
                  if(typeof it[k] === 'string' && it[k].trim()) { label = it[k]; break }
                }
              }
              if(!label) label = String(val)
              return { value: val, label }
            })
          }
          OPTIONS_CACHE[source] = opts
          return opts
        }catch(e){ console.error('fetchOptions', source, e); return [] }
      }

      function createMenu(){
        Object.keys(ENTITIES).forEach(key=>{
          const btn = document.createElement('button')

      async function openEntity(entity){
        content.innerHTML = ''
        const meta = ENTITIES[entity]
        const header = document.createElement('div')

        const h = document.createElement('h2'); h.className='text-2xl font-semibold'; h.textContent = meta.label

            if(entity === 'usuarios') return showUnifiedForm({ tipo: 'usuario' })
            // fallback to existing generic form
            return showForm(entity)
          })
          header.appendChild(btn)
        }
        content.appendChild(header)

          // Handle unified registration screen
          if(entity === 'cadastro-unificado'){
            // open as Cadastro de Responsáveis: always a system user with RESPONSAVEL perfil
            await showUnifiedForm({ tipo: 'usuario', cadastroResponsaveis: true })

          }

        // filters (some entities may show a custom filter input)
        const filters = {}
        if(entity === 'notas'){
          const fwrap = document.createElement('div'); fwrap.className='mb-3'
          const finp = document.createElement('input'); finp.className='border rounded px-2 py-1 text-sm w-64'; finp.placeholder = 'Filtrar por nome do aluno'
          fwrap.appendChild(finp)
          content.appendChild(fwrap)
          const debounce = (fn, wait=300)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait) }}
          finp.addEventListener('input', debounce(()=>{ filters.name = finp.value || undefined; loadAndRender(entity, filters) }))
        }
        if(entity === 'matriculas'){
          const fwrap = document.createElement('div'); fwrap.className='mb-3'
          const finp = document.createElement('input'); finp.className='border rounded px-2 py-1 text-sm w-64'; finp.placeholder = 'Filtrar por nome do aluno'
          fwrap.appendChild(finp)
          content.appendChild(fwrap)
          const debounce = (fn, wait=300)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait) }}
          finp.addEventListener('input', debounce(()=>{ filters.name = finp.value || undefined; loadAndRender(entity, filters) }))
        }
        if(entity === 'avaliacoes'){
          const fwrap = document.createElement('div'); fwrap.className='mb-3'
          const finp = document.createElement('input'); finp.className='border rounded px-2 py-1 text-sm w-64'; finp.placeholder = 'Filtrar por nome da avaliação'
          fwrap.appendChild(finp)
          content.appendChild(fwrap)
          const debounce = (fn, wait=300)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait) }}
          finp.addEventListener('input', debounce(()=>{ filters.descricao = finp.value || undefined; loadAndRender(entity, filters) }))
        }
        if(entity === 'alunos'){
          const fwrap = document.createElement('div'); fwrap.className='mb-3'
          const finp = document.createElement('input'); finp.className='border rounded px-2 py-1 text-sm w-64'; finp.placeholder = 'Filtrar por nome do aluno'
          fwrap.appendChild(finp)
          content.appendChild(fwrap)
          const debounce = (fn, wait=300)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait) }}
          finp.addEventListener('input', debounce(()=>{ filters.name = finp.value || undefined; loadAndRender(entity, filters) }))
        }

        if(entity === 'usuarios'){
          const fwrap = document.createElement('div'); fwrap.className='mb-3'

        if(entity === 'frequencias'){

          // container to render students and save action

          // populate curso and turma selects
          try{

          // when curso selected, filter turmaSel options

              turmas.filter(t=>{
                if(!curso) return true

          // when turma selected, populate discipline select from turma-disciplinas
          async function refreshDisciplinesForTurma(turmaId){
            discSel.innerHTML = ''

            try{
              const tdRes = await axios.get('/turma-disciplinas')

              // filter by id_turma and build labels using disciplinas
              const discIds = tds.filter(td=> String(td.id_turma) === String(turmaId)).map(td=> td.id_disciplina)
              if(!discIds.length) return
              const dRes = await axios.get('/disciplinas')
              const disciplinas = Array.isArray(dRes.data)? dRes.data : []
              disciplinas.filter(d=> discIds.includes(d.id_disciplina)).forEach(d=> discSel.appendChild(new Option(d.nome, d.id_disciplina)))
            }catch(e){ console.error('refreshDisciplinesForTurma', e) }

          turmaSel.addEventListener('change', ()=> refreshDisciplinesForTurma(turmaSel.value || ''))

          // helper: load students for selected turma (and optionally disciplina)
          async function loadStudentsForSelection(){
            studentsContainer.innerHTML = 'Carregando alunos...'
            const turmaId = turmaSel.value || ''
            const discId = discSel.value || ''
            const tdId = (async ()=>{
              if(!turmaId || !discId) return null
              try{
                const tdRes = await axios.get('/turma-disciplinas')
                const tds = Array.isArray(tdRes.data)? tdRes.data : []
                const found = tds.find(x=> String(x.id_turma) === String(turmaId) && String(x.id_disciplina) === String(discId))
                return found? (found.id_turma_disciplina || found.id) : null
              }catch(e){ return null }
            })()
            const resolvedTdId = await tdId
            try{
              // fetch matriculas for the turma
              const [mRes, aRes, uRes] = await Promise.all([axios.get('/matriculas', { params: { id_turma: turmaId } }), axios.get('/alunos'), axios.get('/usuarios')])
              const matriculas = Array.isArray(mRes.data)? mRes.data : []
              const alunos = Array.isArray(aRes.data)? aRes.data : []
              const users = Array.isArray(uRes.data)? uRes.data : []
              const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
              const uMap = {}; users.forEach(u=> uMap[u.id_usuario] = u.nome)

              // filter matriculas by turmaId (backend may return all matriculas)
              const filteredMats = (turmaId && String(turmaId) !== '') ? matriculas.filter(m => String(m.id_turma) === String(turmaId)) : matriculas
              // build list of students from (filtered) matriculas
              const students = filteredMats.map(m=>{
                const aluno = aMap[m.id_aluno]
                const nome = aluno? (uMap[aluno.id_usuario] || '') : ''
                return { id_matricula: m.id_matricula, id_aluno: m.id_aluno, nome }
              })

              // render students with checkboxes
              studentsContainer.innerHTML = ''
              const title = document.createElement('h3'); title.className = 'font-semibold mb-2'; title.textContent = 'Alunos matriculados (' + students.length + ')'
              studentsContainer.appendChild(title)
              const form = document.createElement('div'); form.className = 'space-y-2'
              students.forEach(s=>{
                const row = document.createElement('div'); row.className = 'flex items-center justify-between border rounded px-2 py-1 student-row'
                row.dataset.id_matricula = s.id_matricula
                const left = document.createElement('div'); left.textContent = s.nome || ('Aluno #' + s.id_aluno)
                const right = document.createElement('div'); right.className = 'flex items-center gap-3'

                // create three checkboxes: Presença, Falta, Justificado
                const statuses = [ ['PRESENTE','Presença'], ['FALTA','Falta'], ['JUSTIFICADO','Justificado'] ]
                statuses.forEach(st=>{
                  const wrap = document.createElement('label'); wrap.className = 'flex items-center gap-1 text-sm'
                  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.dataset.id_matricula = s.id_matricula; cb.dataset.status = st[0]
                  // default to PRESENTE checked
                  if(st[0] === 'PRESENTE') cb.checked = true
                  // when one checkbox is checked, uncheck the others for the same student
                  cb.addEventListener('change', (e)=>{
                    try{
                      if(cb.checked){
                        const siblings = right.querySelectorAll('input[data-id_matricula="' + s.id_matricula + '"]')
                        siblings.forEach(si=>{ if(si !== cb) si.checked = false })
                      } else {
                        // prevent all unchecked: keep at least one selected (if user unchecks the last, revert to PRESENTE)
                        const any = Array.from(right.querySelectorAll('input[data-id_matricula="' + s.id_matricula + '"]')).some(x=> x.checked)
                        if(!any){ // re-check PRESENCE
                          const pres = right.querySelector('input[data-status="PRESENTE"][data-id_matricula="' + s.id_matricula + '"]')
                          if(pres) pres.checked = true
                        }
                      }
                    }catch(e){}
                  })
                  const span = document.createElement('span'); span.textContent = st[1]
                  wrap.appendChild(cb); wrap.appendChild(span); right.appendChild(wrap)
                })

                row.appendChild(left); row.appendChild(right); form.appendChild(row)
              })
              studentsContainer.appendChild(form)

              // save button
              const saveBtn = document.createElement('button'); saveBtn.className = 'mt-3 px-3 py-1 bg-schoolGreen-500 text-white rounded'; saveBtn.textContent = 'Salvar presença'
              const status = document.createElement('div'); status.className = 'mt-2 text-sm text-slate-600'
              saveBtn.addEventListener('click', async ()=>{
                // recompute turma-disciplina id at click time to reflect latest selects
                const currentTurmaId = turmaSel.value || ''
                const currentDiscId = discSel.value || ''
                let currentTdId = null
                if(currentTurmaId && currentDiscId){
                  try{
                    const tdResNow = await axios.get('/turma-disciplinas')
                    const tdsNow = Array.isArray(tdResNow.data)? tdResNow.data : []
                    const foundNow = tdsNow.find(x=> String(x.id_turma) === String(currentTurmaId) && String(x.id_disciplina) === String(currentDiscId))
                    currentTdId = foundNow? (foundNow.id_turma_disciplina || foundNow.id) : null
                  }catch(e){ console.error('recompute td id', e) }
                }
                if(!currentTdId){ toast('Selecione uma disciplina válida para salvar presença', true); return }
                saveBtn.disabled = true; saveBtn.textContent = 'Salvando...'
                try{
                  // iterate student rows and post frequencia for each (read selected status)
                  const rows = form.querySelectorAll('.student-row')
                  const dateVal = dateInp.value || new Date().toISOString().slice(0,10)
                  const promises = []
                  rows.forEach(r=>{
                    const mid = r.dataset.id_matricula
                    const checked = r.querySelector('input[type="checkbox"]:checked')
                    const statusVal = checked ? (checked.dataset.status || 'PRESENTE') : 'PRESENTE'
                    const payload = { id_matricula: mid, id_turma_disciplina: currentTdId, data: dateVal, status: statusVal }
                    promises.push(axios.post('/frequencias', payload).catch(e=>{ console.error('post freq', e); return null }))
                  })
                  await Promise.all(promises)
                  status.textContent = 'Presenças salvas.'; status.className = 'mt-2 text-sm text-green-600'
                  toast('Presenças salvas')
                  // refresh main list
                  await loadAndRender('frequencias')
                }catch(e){ console.error('save presences', e); status.textContent = 'Erro ao salvar'; status.className = 'mt-2 text-sm text-red-600'; toast('Erro ao salvar', true) }
                finally{ saveBtn.disabled = false; saveBtn.textContent = 'Salvar presença' }
              })
              studentsContainer.appendChild(saveBtn); studentsContainer.appendChild(status)

            }catch(e){ console.error('loadStudentsForSelection', e); studentsContainer.textContent = 'Erro ao carregar alunos' }
          }

          // wire button to load students
          btnLoadStudents.addEventListener('click', loadStudentsForSelection)
          // also refresh disciplines when the page loads if turma selected
          if(turmaSel.value) refreshDisciplinesForTurma(turmaSel.value)
        }
        if(entity === 'professores'){

          const debounce = (fn, wait=300)=>{ let t; return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait) }}

          toolbar.appendChild(discSel)

        const listWrap = document.createElement('div'); listWrap.className='bg-white p-4 rounded shadow'; listWrap.id='list-wrap'; listWrap.textContent='Carregando...'
        content.appendChild(listWrap)

        await loadAndRender(entity, filters)
      }

      async function loadAndRender(entity, filters={}){
        const wrap = document.getElementById('list-wrap')
        if(!wrap) return
        wrap.innerHTML = 'Carregando...'
        try{
          const res = await axios.get('/' + entity, { params: filters })
          let items = Array.isArray(res.data) ? res.data : []
          // client-side enrichment and filtering for notas
          if(entity === 'notas'){
            const [mRes, aRes, uRes, avRes, tdRes, tRes, dRes] = await Promise.all([axios.get('/matriculas'), axios.get('/alunos'), axios.get('/usuarios'), axios.get('/avaliacoes'), axios.get('/turma-disciplinas'), axios.get('/turmas'), axios.get('/disciplinas')])
              const matriculas = Array.isArray(mRes.data)? mRes.data : []
              const alunos = Array.isArray(aRes.data)? aRes.data : []
              const users = Array.isArray(uRes.data)? uRes.data : []
              const avals = Array.isArray(avRes.data)? avRes.data : []
              const tds = Array.isArray(tdRes.data)? tdRes.data : []
              const turmas = Array.isArray(tRes.data)? tRes.data : []
              const disciplinas = Array.isArray(dRes.data)? dRes.data : []
              const mMap = {}; matriculas.forEach(m=> mMap[m.id_matricula] = m)
              const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
              const uMap = {}; const uCpf = {}
              users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
              const tdMap = {}; tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
              const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
              const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
              const avMap = {}; avals.forEach(av=> avMap[av.id_avaliacao] = av)
              items = items.map(it => {
                const mat = mMap[it.id_matricula]
                const aluno = mat? aMap[mat.id_aluno] : null
                const nome = aluno? (uMap[aluno.id_usuario] || uCpf[aluno.id_usuario] || '') : ''
                const av = avMap[it.id_avaliacao]
                let tdLabel = ''
                if(av && av.id_turma_disciplina){
                  const td = tdMap[av.id_turma_disciplina]
                  const turmaNome = td? (tMap[td.id_turma] || '') : ''
                  const discNome = td? (dMap[td.id_disciplina] || '') : ''
                  tdLabel = (turmaNome && discNome) ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || '')
                }
                return Object.assign({}, it, { _aluno_nome: nome, _avaliacao_desc: (av && av.descricao) ? av.descricao : '', _turma_disciplina: tdLabel })
              })
            if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._aluno_nome||'').toLowerCase().includes(q)) }
          }
            // client-side enrichment for alunos: resolve usuario name into _nome and find responsavel names
            if(entity === 'alunos'){
                try{
                  const [uRes, rRes] = await Promise.all([axios.get('/usuarios'), axios.get('/responsaveis')])
                  const users = Array.isArray(uRes.data)? uRes.data : []
                  const responsaveis = Array.isArray(rRes.data)? rRes.data : []
                  const uMap = {}
                  users.forEach(u=> { try{ const key = String(u.id_usuario || u.id || u.id_usuario); uMap[key] = u.nome || (u.cpf || '') }catch(e){} })
                  // build map alunoId -> [usuarioId]
                  const respMap = {}
                  responsaveis.forEach(r=>{
                    try{
                      const aid = r.tb_alunos_id_aluno || r.tbAlunosIdAluno || r.id_aluno || r.alunoId || r['tb_alunos_id_aluno']
                      const uid = r.tb_usuarios_id_usuario || r.tbUsuariosIdUsuario || r.id_usuario || r.usuarioId || r['tb_usuarios_id_usuario']
                      if(!aid) return
                      const aKey = String(aid)
                      const uKey = String(uid)
                      if(!respMap[aKey]) respMap[aKey] = []
                      respMap[aKey].push(uKey)
                    }catch(e){}
                  })
                  items = items.map(it=>{
                    try{
                      const aKey = String(it.id_aluno || it.id)
                      const nomes = (respMap[aKey] || []).map(uid=> (uMap[uid] || '') ).filter(Boolean)
                      return Object.assign({}, it, { _nome: (uMap[String(it.id_usuario)] || ''), _responsavel_nome: nomes.join('; ') })
                    }catch(e){ return Object.assign({}, it, { _nome: '', _responsavel_nome: '' }) }
                  })
                  if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._nome||'').toLowerCase().includes(q)) }
                }catch(e){ console.error('alunos enrichment', e) }
            }
            // client-side filtering for usuarios (by nome)
            if(entity === 'usuarios'){
              if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i.nome||'').toLowerCase().includes(q)) }
            }
          // client-side enrichment for matriculas: resolve aluno name and turma name
          if(entity === 'matriculas'){
            const [aRes, uRes, tRes] = await Promise.all([axios.get('/alunos'), axios.get('/usuarios'), axios.get('/turmas')])
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; const uCpf = {}
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            items = items.map(it => {
              const aluno = aMap[it.id_aluno]
              const nome = aluno? (uMap[aluno.id_usuario] || uCpf[aluno.id_usuario] || '') : ''
              const turmaNome = tMap[it.id_turma] || ''
              return Object.assign({}, it, { _aluno_nome: nome, _turma_nome: turmaNome })
            })
            if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i._aluno_nome||'').toLowerCase().includes(q)) }
          }
          // client-side enrichment and filtering for turma-disciplinas
          if(entity === 'turma-disciplinas'){
            const [tRes, dRes, pRes, uRes] = await Promise.all([axios.get('/turmas'), axios.get('/disciplinas'), axios.get('/professores'), axios.get('/usuarios')])
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const disciplinas = Array.isArray(dRes.data)? dRes.data : []
            const profs = Array.isArray(pRes.data)? pRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            const uMapProf = {}; const uCpfProf = {}
            users.forEach(u=> { uMapProf[u.id_usuario] = u.nome; uCpfProf[u.id_usuario] = u.cpf })
            const pMap = {}
            profs.forEach(p=>{ const u = users.find(x=> x.id_usuario === p.id_usuario); pMap[p.id_professor] = (u? u.nome : (uCpfProf[p.id_usuario]||'')) })
            items = items.map(it => Object.assign({}, it, { _turma_nome: tMap[it.id_turma] || '', _disciplina_nome: dMap[it.id_disciplina] || '', _professor_nome: pMap[it.id_professor] || '' }))
            if(filters.id_turma) items = items.filter(i=> String(i.id_turma) === String(filters.id_turma))
            if(filters.id_disciplina) items = items.filter(i=> String(i.id_disciplina) === String(filters.id_disciplina))
            if(filters.id_professor) items = items.filter(i=> String(i.id_professor) === String(filters.id_professor))
          }
          // client-side enrichment and filtering for professores
          if(entity === 'professores'){
            const [uRes, tdRes, tRes, dRes] = await Promise.all([axios.get('/usuarios'), axios.get('/turma-disciplinas'), axios.get('/turmas'), axios.get('/disciplinas')])
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tds = Array.isArray(tdRes.data)? tdRes.data : []
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const disciplinas = Array.isArray(dRes.data)? dRes.data : []
            const uMap = {}; const uCpf = {}
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            // build assignments per professor
            const assignments = {}
            tds.forEach(td=>{
              const profId = td.id_professor
              if(!assignments[profId]) assignments[profId] = []
              const tName = tMap[td.id_turma] || ''
              const dName = dMap[td.id_disciplina] || ''
              assignments[profId].push({ id_td: td.id_turma_disciplina, turma: tName, disciplina: dName, id_disciplina: td.id_disciplina })
            })
            items = items.map(it=>{
              const nome = uMap[it.id_usuario] || ''
              const aulas = (assignments[it.id_professor] || []).map(a=> (a.turma && a.disciplina) ? (a.turma + ' — ' + a.disciplina) : (a.turma || a.disciplina)).join('; ')
              const disciplinasIds = (assignments[it.id_professor] || []).map(a=> a.id_disciplina)
              return Object.assign({}, it, { _nome: nome, _aulas: aulas, _disciplinas_ids: disciplinasIds, cpf: (uCpf[it.id_usuario] || '') })
            })
            if(filters.professor_name) { const q = String(filters.professor_name).toLowerCase(); items = items.filter(i=> (i._nome||'').toLowerCase().includes(q)) }
            if(filters.disciplina_id) { items = items.filter(i=> (i._disciplinas_ids||[]).some(id=> String(id) === String(filters.disciplina_id))) }

          if(entity === 'disciplinas'){
            if(filters.name){ const q = String(filters.name).toLowerCase(); items = items.filter(i=> (i.nome||'').toLowerCase().includes(q)) }
          }
          // client-side enrichment and filtering for avaliacoes
          if(entity === 'avaliacoes'){
            try{

              const turmas = Array.isArray(tRes.data)? tRes.data : []
              const disciplinas = Array.isArray(dRes.data)? dRes.data : []
              const tdMap = {}; tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
              const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
              const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
              items = items.map(it => {
                const td = tdMap[it.id_turma_disciplina]
                const turmaNome = td? tMap[td.id_turma] : ''
                const discNome = td? dMap[td.id_disciplina] : ''
                const tdLabel = (turmaNome && discNome) ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || it.id_turma_disciplina)
                return Object.assign({}, it, { _turma_disciplina_label: tdLabel })
              })
              if(filters.descricao){ const q = String(filters.descricao).toLowerCase(); items = items.filter(i=> (i.descricao||'').toLowerCase().includes(q)) }
            }catch(e){ console.error('avaliacoes enrichment', e) }
          }
          // client-side filtering for turmas
          if(entity === 'turmas'){
            if(filters.turma_name){ const q = String(filters.turma_name).toLowerCase(); items = items.filter(i=> (i.nome||'').toLowerCase().includes(q)) }
            if(filters.ano_letivo){ items = items.filter(i=> String(i.ano_letivo) === String(filters.ano_letivo)) }
          }
          // client-side enrichment and filtering for frequencias
          if(entity === 'frequencias'){
            const [mRes, aRes, uRes, tdRes, tRes, dRes] = await Promise.all([axios.get('/matriculas'), axios.get('/alunos'), axios.get('/usuarios'), axios.get('/turma-disciplinas'), axios.get('/turmas'), axios.get('/disciplinas')])
            const matriculas = Array.isArray(mRes.data)? mRes.data : []
            const alunos = Array.isArray(aRes.data)? aRes.data : []
            const users = Array.isArray(uRes.data)? uRes.data : []
            const tds = Array.isArray(tdRes.data)? tdRes.data : []
            const turmas = Array.isArray(tRes.data)? tRes.data : []
            const disciplinas = Array.isArray(dRes.data)? dRes.data : []
            const mMap = {}; matriculas.forEach(m=> mMap[m.id_matricula] = m)
            const aMap = {}; alunos.forEach(a=> aMap[a.id_aluno] = a)
            const uMap = {}; const uCpf = {}
            users.forEach(u=> { uMap[u.id_usuario] = u.nome; uCpf[u.id_usuario] = u.cpf })
            const tdMap = {}; tds.forEach(td=> tdMap[td.id_turma_disciplina] = td)
            const tMap = {}; turmas.forEach(t=> tMap[t.id_turma] = t.nome)
            const dMap = {}; disciplinas.forEach(d=> dMap[d.id_disciplina] = d.nome)
            items = items.map(it => {
              const mat = mMap[it.id_matricula]
              const aluno = mat? aMap[mat.id_aluno] : null
              const nome = aluno? (uMap[aluno.id_usuario] || uCpf[aluno.id_usuario] || '') : ''
              const td = tdMap[it.id_turma_disciplina]
              const turmaNome = td? (tMap[td.id_turma] || '') : ''

              const tdLabel = turmaNome && discNome ? (turmaNome + ' — ' + discNome) : (turmaNome || discNome || it.id_turma_disciplina)
              return Object.assign({}, it, { _aluno_nome: nome, _turma_disciplina_label: tdLabel })

          }
          // store enriched items for pagination and reset page when filters change
          lastLoadedItems[entity] = items
          pageState[entity] = 1
          renderTable(entity, items)
        }catch(err){
          wrap.textContent = 'Erro ao carregar — ver console'
          toast('Erro: ' + (err.response? err.response.status + ' ' + err.response.statusText : err.message), true)
        }
